<!-- ============================================================
     FIREBASE — SDK legado v8 (100% clássico, sem ES modules e
     sem import() dinâmico internamente). O SDK v9/v10, mesmo em
     modo "compat", usa import() por baixo dos panos e por isso
     não funciona de forma confiável abrindo o arquivo via file://.
     A v8 evita esse problema por completo.
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyC8U6AjKIga3jDZc1QzYcbf_pH8LAztQJ4",
    authDomain: "sofir-logistics.firebaseapp.com",
    projectId: "sofir-logistics",
    storageBucket: "sofir-logistics.firebasestorage.app",
    messagingSenderId: "897848530347",
    appId: "1:897848530347:web:e1cb65005b84b48fedeeee",
    measurementId: "G-6K5FEY1ZDR",
  };

  if (typeof firebase === "undefined") {
    console.error("SDK do Firebase não carregou (bloqueio de rede?).");
    window.ST = window.ST || {};
    window.dispatchEvent(new Event("st:firebase-failed"));
    return;
  }

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  // -------- shim: mesma "assinatura" da API modular (v9+), rodando
  // por baixo dos panos sobre o SDK compat (v8-style), clássico. Isso
  // permite manter todo o resto do código do app sem alterações.
  function wrapSnap(snap) {
    return { exists: () => !!snap.exists, data: () => snap.data(), id: snap.id, ref: snap.ref };
  }
  function onAuthStateChanged(authInst, cb) { return authInst.onAuthStateChanged(cb); }
  function signInWithEmailAndPassword(authInst, email, pw) { return authInst.signInWithEmailAndPassword(email, pw); }
  function createUserWithEmailAndPassword(authInst, email, pw) { return authInst.createUserWithEmailAndPassword(email, pw); }
  function updatePassword(user, pw) { return user.updatePassword(pw); }
  function signOut(authInst) { return authInst.signOut(); }

  function doc(dbInst, collectionName, id) { return dbInst.collection(collectionName).doc(id); }
  function getDoc(docRef) { return docRef.get().then(wrapSnap); }
  function getDocs(q) { return q.get(); }
  function setDoc(docRef, data, options) { return docRef.set(data, options || {}); }
  function updateDoc(docRef, data) { return docRef.update(data); }
  function deleteDoc(docRef) { return docRef.delete(); }
  function addDoc(collRef, data) { return collRef.add(data); }
  function collection(dbInst, name) { return dbInst.collection(name); }
  function onSnapshot(ref, cb, errCb) { return ref.onSnapshot(cb, errCb); }
  function orderBy(field, dir) { return (q) => q.orderBy(field, dir || "asc"); }
  function where(field, op, val) { return (q) => q.where(field, op, val); }
  function limit(n) { return (q) => q.limit(n); }
  function query(base, ...constraints) { return constraints.reduce((acc, fn) => fn(acc), base); }
  function serverTimestamp() { return firebase.firestore.FieldValue.serverTimestamp(); }
  function increment(n) { return firebase.firestore.FieldValue.increment(n); }
  function runTransaction(dbInst, updateFn) {
    return dbInst.runTransaction((tx) =>
      updateFn({
        get: (ref) => tx.get(ref).then(wrapSnap),
        set: (ref, data, opts) => tx.set(ref, data, opts),
        update: (ref, data) => tx.update(ref, data),
        delete: (ref) => tx.delete(ref),
      })
    );
  }

  function storageRef(storageInst, path) { return storageInst.ref(path); }
  function uploadBytes(ref, file) {
    return new Promise((resolve, reject) => {
      const task = ref.put(file);
      const timer = setTimeout(() => {
        try { task.cancel(); } catch (e) {}
        reject(new Error(`Tempo esgotado enviando "${file.name}". Confira as regras do Storage no Firebase.`));
      }, 45000);
      task.on(
        "state_changed",
        null,
        (err) => {
          clearTimeout(timer);
          if (err.code === "storage/unauthorized") {
            reject(new Error(`Sem permissão para enviar "${file.name}" — as regras do Storage no Firebase precisam permitir usuários autenticados.`));
          } else if (err.code === "storage/canceled") {
            reject(new Error(`Envio de "${file.name}" cancelado (tempo esgotado).`));
          } else {
            reject(err);
          }
        },
        () => {
          clearTimeout(timer);
          resolve({ ref: task.snapshot.ref });
        }
      );
    });
  }
  function getDownloadURL(ref) { return ref.getDownloadURL(); }
  function deleteObject(ref) { return ref.delete(); }

  // Cria a conta de OUTRA pessoa (setor ou motorista) sem deslogar quem
  // está usando o app agora. Necessário porque criar um usuário no
  // Firebase Auth pelo cliente normalmente troca a sessão ativa para
  // o usuário recém-criado — usamos um app Firebase secundário e
  // descartável só para esse fim.
  async function createAuthAccountKeepSession(email, password) {
    const secondary = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
    try {
      const cred = await secondary.auth().createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await secondary.auth().signOut();
      return uid;
    } finally {
      await secondary.delete();
    }
  }

  window.ST = window.ST || {};
  window.ST.firebase = {
    app, auth, db, storage,
    onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, signOut,
    doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, orderBy, limit,
    onSnapshot, serverTimestamp, increment, runTransaction,
    storageRef, uploadBytes, getDownloadURL, deleteObject,
    createAuthAccountKeepSession,
  };
  window.dispatchEvent(new Event("st:firebase-ready"));
})();
</script>


<!-- ============================================================
     APP — shell React + design system (Parte 1)
     ============================================================ -->
<script type="text/plain" id="app-source">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

/* ---------------------------------------------------------------
   ROUTER — hash router simples (substitui react-router-dom, que
   não tem build UMD estável para uso sem bundler)
--------------------------------------------------------------- */
const RouterContext = createContext(null);

function useHashPath() {
  const [path, setPath] = useState(() => window.location.hash.slice(1) || "/login");
  useEffect(() => {
    const onChange = () => setPath(window.location.hash.slice(1) || "/login");
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return path;
}

function navigate(path) {
  window.location.hash = path;
}

function RouterProvider({ children }) {
  const path = useHashPath();
  return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
}

function useRouter() {
  return useContext(RouterContext);
}

/* ---------------------------------------------------------------
   SETORES — lista fixa da empresa (não são mais login — são só a
   opção de setor atribuída a cada usuário cadastrado)
--------------------------------------------------------------- */
const DEPARTMENTS = [
  "Almoxarifado", "Caldeiraria", "Comercial", "Compras", "Controle de Qualidade",
  "Diretoria", "Financeiro", "Manutenção", "Orçamentos", "PCP", "Pintura",
  "Portaria", "Produção", "RH", "Secretaria", "Segurança do Trabalho",
  "Servisse", "Systems", "Usinagem", "Outros",
].map((nome) => ({ nome, slug: slugify(nome) }));

function slugify(str) {
  return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function findDepartmentBySlug(slug) {
  return DEPARTMENTS.find((d) => d.slug === slug);
}

// email sintético do Firebase Auth — usado tanto pro login pessoal de
// cada usuário cadastrado quanto pra Logística.
function loginEmail(slug) {
  return `${slug}@stlogistica.app`;
}

function driverEmail(loginSlug) {
  return `motorista-${loginSlug}@stlogistica.app`;
}

// O Firebase Auth exige senha com no mínimo 6 caracteres — mas o padrão
// pedido para o sistema é "1234" (4 dígitos). Em vez de expor essa regra
// pro usuário, todo login/criação de conta passa a senha "de vitrine" por
// aqui, que a transforma numa senha real válida por baixo dos panos.
function toAuthPassword(rawPassword) {
  return `stlog-${rawPassword}`;
}

function describeAuthError(err) {
  switch (err.code) {
    case "auth/wrong-password":
    case "auth/invalid-credential":
    case "auth/internal-error":
    case "auth/user-not-found":
      return "Senha incorreta.";
    case "auth/operation-not-allowed":
      return "Login por e-mail/senha está desativado no Firebase. No Console → Authentication → Sign-in method, habilite “E-mail/senha”.";
    case "auth/network-request-failed":
      return "Falha de rede ao falar com o Firebase. Verifique sua internet ou se a rede corporativa bloqueia identitytoolkit.googleapis.com.";
    case "auth/too-many-requests":
      return "Muitas tentativas seguidas. Aguarde um momento e tente de novo.";
    case "auth/user-disabled":
      return "Essa conta foi desativada.";
    case "auth/configuration-not-found":
      return "Configuração do Firebase Auth não encontrada — confira o firebaseConfig do projeto.";
    default:
      return `Não foi possível entrar (${err.code || err.message || "erro desconhecido"}).`;
  }
}

/* ---------------------------------------------------------------
   AUTENTICAÇÃO — login por setor (Firebase Auth) + perfil (Firestore)

   Estratégia: cada setor é um usuário do Firebase Auth com email
   sintético `${slug}@stlogistica.app`. No primeiro acesso de um
   setor válido com a senha padrão "1234", a conta é criada
   automaticamente (não há backend/admin SDK nesta arquitetura
   client-only). Acessos seguintes fazem apenas signIn normal.
--------------------------------------------------------------- */
const AuthContext = createContext(null);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [firebaseFailed, setFirebaseFailed] = useState(false);

  useEffect(() => {
    let unsub = () => {};
    const start = () => {
      const { auth, onAuthStateChanged, doc, getDoc } = window.ST.firebase;
      unsub = onAuthStateChanged(auth, async (fbUser) => {
        setUser(fbUser);
        if (fbUser) {
          try {
            const snap = await getDoc(doc(window.ST.firebase.db, "users", fbUser.uid));
            if (snap.exists()) {
              setProfile(snap.data());
            } else if (fbUser.email === loginEmail("logistica")) {
              // auto-cura: a conta raiz da Logística nunca pode ficar sem perfil válido
              const { setDoc, serverTimestamp } = window.ST.firebase;
              const freshProfile = {
                role: "logistica",
                nome: "Logística",
                setorNome: "Logística",
                mustChangePassword: false,
                createdAt: serverTimestamp(),
              };
              await setDoc(doc(window.ST.firebase.db, "users", fbUser.uid), freshProfile);
              setProfile(freshProfile);
            } else {
              setProfile(null);
            }
          } catch (err) {
            console.error("Erro ao carregar perfil:", err);
            setProfile(null);
          }
        } else {
          setProfile(null);
        }
        setAuthLoading(false);
      });
    };
    const onFail = () => {
      setFirebaseFailed(true);
      setAuthLoading(false);
    };
    if (window.ST && window.ST.firebase) start();
    else {
      window.addEventListener("st:firebase-ready", start, { once: true });
      window.addEventListener("st:firebase-failed", onFail, { once: true });
    }
    // salvaguarda: se nenhum evento chegar em 10s (ex: CDN bloqueado
    // silenciosamente pela rede), não deixa a tela presa carregando.
    const timeout = setTimeout(() => {
      if (!(window.ST && window.ST.firebase)) onFail();
    }, 10000);
    return () => {
      unsub();
      clearTimeout(timeout);
    };
  }, []);

  if (firebaseFailed) {
    return (
      <div className="min-h-screen bg-ink flex items-center justify-center p-6">
        <div className="max-w-sm text-center text-white">
          <div className="w-12 h-12 rounded-2xl bg-brand flex items-center justify-center font-display font-bold mx-auto mb-4">!</div>
          <p className="font-display font-semibold mb-2">Não foi possível conectar ao Firebase</p>
          <p className="text-sm text-white/60">
            Verifique sua conexão com a internet. Se estiver numa rede corporativa, os domínios
            <span className="text-white/90"> gstatic.com </span> e <span className="text-white/90">googleapis.com</span> precisam estar liberados.
          </p>
          <Button variant="outline" size="sm" className="mt-4 bg-transparent text-white border-white/20 hover:border-white" onClick={() => window.location.reload()}>
            Tentar novamente
          </Button>
        </div>
      </div>
    );
  }

  const authValue = { user, profile, authLoading, login: null, logout: null };
  return <AuthProviderInner value={authValue}>{children}</AuthProviderInner>;
}

function AuthProviderInner({ value, children }) {
  const { user, profile, authLoading } = value;

  const login = useCallback(async (rawInput, senha) => {
    const trimmed = rawInput.trim();
    const slug = slugify(trimmed);
    const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, getDoc, setDoc, serverTimestamp, db } = window.ST.firebase;

    // LOGÍSTICA — único login com auto-provisionamento no primeiro acesso
    // (é o login "raiz": não existe ninguém ainda pra cadastrá-lo). Também
    // é auto-curável: se a conta existir no Auth mas o perfil tiver
    // sumido do Firestore por algum motivo, recria o perfil sozinho.
    if (slug === "logistica") {
      const email = loginEmail(slug);
      let uid = null;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, toAuthPassword(senha));
        uid = cred.user.uid;
      } catch (err) {
        if (senha !== "1234") {
          throw new Error(describeAuthError(err));
        }
        try {
          const cred = await createUserWithEmailAndPassword(auth, email, toAuthPassword(senha));
          uid = cred.user.uid;
        } catch (err2) {
          if (err2.code === "auth/email-already-in-use") {
            try {
              const cred2 = await signInWithEmailAndPassword(auth, email, toAuthPassword(senha));
              uid = cred2.user.uid;
            } catch {
              throw new Error("Senha incorreta.");
            }
          } else {
            throw new Error(describeAuthError(err2));
          }
        }
      }
      if (uid) {
        const snap = await getDoc(doc(db, "users", uid));
        if (!snap.exists()) {
          await setDoc(doc(db, "users", uid), {
            role: "logistica",
            nome: "Logística",
            setorNome: "Logística",
            mustChangePassword: false,
            createdAt: serverTimestamp(),
          });
        }
      }
      return;
    }

    // USUÁRIO ou MOTORISTA — ambos logam pelo nome/login pessoal agora.
    // Tenta primeiro como usuário comum; se a conta não existir com esse
    // login, tenta como motorista (email tem prefixo interno diferente).
    const CREDENTIAL_ERRORS = ["auth/user-not-found", "auth/wrong-password", "auth/invalid-credential", "auth/internal-error"];

    try {
      await signInWithEmailAndPassword(auth, loginEmail(slug), toAuthPassword(senha));
      return;
    } catch (errUsuario) {
      if (!CREDENTIAL_ERRORS.includes(errUsuario.code)) {
        throw new Error(describeAuthError(errUsuario));
      }
      try {
        await signInWithEmailAndPassword(auth, driverEmail(slug), toAuthPassword(senha));
        return;
      } catch (errMotorista) {
        if (!CREDENTIAL_ERRORS.includes(errMotorista.code)) {
          throw new Error(describeAuthError(errMotorista));
        }
        throw new Error("Usuário não encontrado ou senha incorreta.");
      }
    }
  }, []);


  const logout = useCallback(async () => {
    const { auth, signOut } = window.ST.firebase;
    await signOut(auth);
    navigate("/login");
  }, []);

  return (
    <AuthContext.Provider value={{ user, profile, authLoading, login, logout }}>
      {children}
    </AuthContext.Provider>
  );
}

function useAuth() {
  return useContext(AuthContext);
}

/* ---------------------------------------------------------------
   ÍCONES — wrapper para lucide (biblioteca vanilla, sem build)
--------------------------------------------------------------- */
function Icon({ name, className = "", size = 18, strokeWidth = 2 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svgStr = window.lucide.icons[toPascal(name)];
    }
  }, [name]);

  // lucide UMD expõe createIcons() global; usamos <i data-lucide> + createIcons()
  return <i data-lucide={name} className={className} style={{ width: size, height: size, strokeWidth }}></i>;
}
function toPascal(str) {
  return str.split("-").map((s) => s[0].toUpperCase() + s.slice(1)).join("");
}
function refreshIcons() {
  if (window.lucide) window.lucide.createIcons();
}

/* ---------------------------------------------------------------
   TOASTS — sistema global de notificações
--------------------------------------------------------------- */
const ToastContext = createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);

  const push = useCallback((toast) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, type: "info", ...toast }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), toast.duration || 4000);
  }, []);

  const dismiss = (id) => setToasts((t) => t.filter((x) => x.id !== id));

  return (
    <ToastContext.Provider value={{ push }}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 w-[320px] max-w-[calc(100vw-2rem)]">
        {toasts.map((t) => (
          <div
            key={t.id}
            onClick={() => dismiss(t.id)}
            className={
              "cursor-pointer animate-toastIn rounded-2xl shadow-lift px-4 py-3 flex items-start gap-3 border " +
              (t.type === "error"
                ? "bg-ink text-white border-brand/40"
                : t.type === "success"
                ? "bg-ink text-white border-white/10"
                : "bg-ink text-white border-white/10")
            }
          >
            <div className={"mt-0.5 w-2 h-2 rounded-full shrink-0 " + (t.type === "error" ? "bg-brand" : t.type === "success" ? "bg-emerald-400" : "bg-white")} />
            <div className="flex-1 min-w-0">
              {t.title && <p className="text-sm font-semibold leading-tight">{t.title}</p>}
              {t.message && <p className="text-xs text-white/70 mt-0.5 leading-snug">{t.message}</p>}
            </div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() {
  return useContext(ToastContext);
}

function Button({ variant = "primary", size = "md", className = "", icon, children, ...props }) {
  const base = "inline-flex items-center justify-center gap-2 font-medium rounded-xl transition-all duration-150 active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none";
  const sizes = { sm: "text-xs px-3 py-1.5", md: "text-sm px-4 py-2.5", lg: "text-sm px-5 py-3" };
  const variants = {
    primary: "bg-ink text-white hover:bg-brand shadow-soft",
    brand: "bg-brand text-white hover:bg-brand-dark shadow-soft",
    ghost: "bg-transparent text-ink hover:bg-mist",
    outline: "bg-white text-ink border border-line hover:border-ink",
    subtle: "bg-mist text-ink hover:bg-line",
  };
  return (
    <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...props}>
      {icon && <Icon name={icon} size={16} />}
      {children}
    </button>
  );
}

function Card({ className = "", children, ...props }) {
  return (
    <div className={`bg-white rounded-2xl border border-line shadow-soft ${className}`} {...props}>
      {children}
    </div>
  );
}

function Input({ label, error, icon, className = "", ...props }) {

      <div className="relative">

            error ? "border-brand" : "border-line"

          {...props}
        />
      </div>
      {error && <span className="block text-[11px] text-brand mt-1">{error}</span>}

}

/* Elemento-assinatura da identidade visual: a "linha de rota" —
   uma barra de progresso pontilhada, como uma estrada, com um
   marcador (caminhão/ponto) avançando conforme o status da ST.
   1=Criada 2=Programada(ou "Reprogramar" se precisaReagendar) 3=Em Rota 4=Concluída */
const FLOW_STEPS = ["solicitacao", "programada", "em_rota", "finalizada"];
function RouteProgress({ status = "solicitacao", compact = false, precisaReagendar = false }) {
  const idx = FLOW_STEPS.indexOf(status);
  return (
    <div className="w-full">
      <div className="relative flex items-center">
        <div className="absolute left-0 right-0 h-[3px] bg-line rounded-full" style={{ backgroundImage: "repeating-linear-gradient(90deg, #E7E7E9 0 6px, transparent 6px 12px)" }} />
        <div
          className="absolute left-0 h-[3px] bg-ink rounded-full transition-all duration-700 ease-out"
          style={{ width: `${(idx / (FLOW_STEPS.length - 1)) * 100}%` }}
        />
        {FLOW_STEPS.map((step, i) => {
          const reached = i <= idx;
          const current = i === idx;
          const isReprogramStep = i === 1 && precisaReagendar;
          return (
            <div key={step} className="relative z-10 flex-1 flex justify-center first:justify-start last:justify-end">
              <div
                className={`rounded-full flex items-center justify-center transition-all duration-300 ${
                  isReprogramStep ? "bg-brand" : reached ? "bg-ink" : "bg-white border-2 border-line"
                } ${current || isReprogramStep ? "ring-4 ring-brand/15" : ""}`}
                style={{ width: compact ? 10 : 14, height: compact ? 10 : 14 }}
              >
                {(current || isReprogramStep) && step !== "finalizada" && <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulseDot" />}
              </div>
            </div>
          );
        })}
      </div>
      {!compact && (
        <div className="flex justify-between mt-2 text-[10px] font-medium text-muted uppercase tracking-wide">
          <span className={idx >= 0 ? "text-ink" : ""}>Solicitação</span>
          <span className={precisaReagendar ? "text-brand" : idx >= 1 ? "text-ink" : ""}>{precisaReagendar ? "Reprogramar" : "Programada"}</span>
          <span className={idx >= 2 ? "text-ink" : ""}>Em Rota</span>
          <span className={idx >= 3 ? "text-ink" : ""}>Concluída</span>
        </div>
      )}
    </div>
  );
}

function Skeleton({ className = "" }) {
  return <div className={`skeleton rounded-lg ${className}`} />;
}

function InstallPWAButton() {
  const [deferred, setDeferred] = useState(null);
  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setDeferred(e);
    };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);
  if (!deferred) return null;
  return (
    <Button
      variant="outline"
      size="sm"
      icon="download"
      onClick={async () => {
        deferred.prompt();
        await deferred.userChoice;
        setDeferred(null);
      }}
    >
      Instalar app
    </Button>
  );
}

function LoginPage() {
  const [setor, setSetor] = useState("");
  const [senha, setSenha] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const toast = useToast();
  const auth = useAuth();

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!setor.trim() || !senha.trim()) {
      setError("Preencha setor e senha.");
      return;
    }
    setLoading(true);
    try {
      await auth.login(setor, senha);
      toast.push({ type: "success", title: "Bem-vindo!", message: "Login realizado com sucesso." });
      navigate("/dashboard");
    } catch (err) {
      setError(err.message || "Não foi possível entrar.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen bg-ink flex items-center justify-center p-4 relative overflow-hidden">
      {/* linha de rota decorativa de fundo */}
      <div className="absolute inset-0 opacity-[0.06] pointer-events-none" style={{
        backgroundImage: "repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 26px)"
      }} />

      <div className="w-full max-w-sm animate-fadeUp relative">
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-2xl bg-brand flex items-center justify-center font-display font-bold text-white text-xl shadow-lift mb-4">
            ST
          </div>
          <h1 className="font-display text-white text-xl font-semibold tracking-tight">ST Logística</h1>
          <p className="text-white/50 text-sm mt-1">Controle de Solicitações de Transporte</p>
        </div>

        <Card className="bg-white p-6">
          <form onSubmit={handleSubmit} className="flex flex-col gap-4">
            <Input
              label="Usuário"
              icon="user"
              placeholder="seu usuário"
              value={setor}
              onChange={(e) => setSetor(e.target.value)}
              autoComplete="username"
            />
            <Input
              label="Senha"
              icon="lock"
              type="password"
              placeholder="••••"
              value={senha}
              onChange={(e) => setSenha(e.target.value)}

            />
            {error && (
              <p className="text-xs text-brand bg-brand-soft rounded-lg px-3 py-2 -mt-1">{error}</p>

        </Card>

        <p className="text-center text-white/30 text-xs mt-6">
          Seu login é cadastrado pela Logística · senha inicial <span className="text-white/50 st-number">1234</span>
        </p>
      </div>
    </div>
  );
}

function ChangePasswordCard() {
  const { user, profile } = useAuth();
  const [senhaAtual, setSenhaAtual] = useState("");
  const [novaSenha, setNovaSenha] = useState("");
  const [confirmarSenha, setConfirmarSenha] = useState("");
  const [saving, setSaving] = useState(false);
  const toast = useToast();

  const handleChangePassword = async (e) => {
    e.preventDefault();
    if (novaSenha.length < 4) {
      toast.push({ type: "error", title: "Senha muito curta", message: "Use pelo menos 4 caracteres." });
      return;
    }
    if (novaSenha !== confirmarSenha) {
      toast.push({ type: "error", title: "As senhas não coincidem" });
      return;
    }
    setSaving(true);
    try {
      const { auth, signInWithEmailAndPassword, updatePassword, doc, updateDoc, db } = window.ST.firebase;
      // reautentica com a senha atual antes de trocar (o Firebase exige isso pra operações sensíveis)
      await signInWithEmailAndPassword(auth, user.email, toAuthPassword(senhaAtual));
      await updatePassword(auth.currentUser, toAuthPassword(novaSenha));
      await updateDoc(doc(db, "users", user.uid), { mustChangePassword: false });
      toast.push({ type: "success", title: "Senha alterada com sucesso" });
      setSenhaAtual("");
      setNovaSenha("");
      setConfirmarSenha("");
    } catch (err) {
      toast.push({
        type: "error",
        title: "Erro ao trocar senha",
        message: ["auth/wrong-password", "auth/internal-error", "auth/invalid-credential"].includes(err.code) ? "Senha atual incorreta." : err.message,
      });
    } finally {
      setSaving(false);
    }
  };

  return (
    <Card className="p-5">
      <h2 className="font-display font-semibold text-sm mb-4">Alterar senha</h2>
      <form onSubmit={handleChangePassword} className="flex flex-col gap-3">
        <Input label="Senha atual" type="password" value={senhaAtual} onChange={(e) => setSenhaAtual(e.target.value)} />
        <Input label="Nova senha" type="password" value={novaSenha} onChange={(e) => setNovaSenha(e.target.value)} />
        <Input label="Confirmar nova senha" type="password" value={confirmarSenha} onChange={(e) => setConfirmarSenha(e.target.value)} />
        <Button type="submit" variant="brand" className="mt-1" disabled={saving}>
          {saving ? "Salvando..." : "Salvar nova senha"}
        </Button>
      </form>
    </Card>
  );
}

function ProgramacaoPage() {
  const { data: sts, loading } = useAllSTs();
  const { data: drivers } = useCollection("drivers", "nome");
  const [managing, setManaging] = useState(null);
  const [search, setSearch] = useState("");
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [groupModalOpen, setGroupModalOpen] = useState(false);
  const toast = useToast();

  const pendentes = sortQueue(sts.filter((s) => s.status === "solicitacao")).filter((s) => {
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return [s.numero, s.fornecedorDestino, s.solicitanteNome, s.criadoPorNome, s.notaFiscal, s.pedidosCompra, s.cidade]
      .some((v) => (v || "").toLowerCase().includes(q));
  });

  const toggleSelect = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const exitSelectMode = () => {
    setSelectMode(false);
    setSelectedIds(new Set());
  };

  const selecionadas = pendentes.filter((s) => selectedIds.has(s.id) && !s.isGrupo);

  const saveAssignment = async (st, motoristaId, status, dataDesejada, horario) => {
    try {
      await applySTAssignment(st, motoristaId, status, dataDesejada, horario, drivers);
      toast.push({ type: "success", title: "ST programada" });
      setManaging(null);
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao programar", message: err.message });
    }
  };

  return (
    <div className="flex-1 min-h-screen bg-mist">
      <Topbar title="Programação" subtitle="Solicitações aguardando programação, por prioridade" />
      <div className="p-6 flex flex-col gap-4 pb-24">
        <Card className="p-4">
          <div className="flex items-center gap-3">
            <div className="flex-1"><Input icon="search" placeholder="Buscar por nº, fornecedor, solicitante, pedido, NF..." value={search} onChange={(e) => setSearch(e.target.value)} /></div>
            <Button
              variant={selectMode ? "brand" : "outline"}
              size="sm"
              icon="layers"
              onClick={() => (selectMode ? exitSelectMode() : setSelectMode(true))}
            >
              {selectMode ? "Cancelar seleção" : "Agrupar STs"}
            </Button>
          </div>
          {search.trim() && (
            <button onClick={() => setSearch("")} className="text-[11px] text-brand mt-2 hover:underline">
              Limpar busca
            </button>
          )}
          {selectMode && (
            <p className="text-[11px] text-muted mt-2">Selecione as STs do mesmo fornecedor/local pra juntar num grupo só. Clique nos cards abaixo.</p>
          )}
        </Card>
        {loading ? (
          <div className="grid md:grid-cols-2 gap-4"><Skeleton className="h-40" /><Skeleton className="h-40" /></div>
        ) : pendentes.length === 0 ? (
          <Card className="p-10">
            <EmptyState
              icon={search.trim() ? "search-x" : "calendar-check"}
              title={search.trim() ? "Nenhuma ST encontrada" : "Tudo programado!"}
              subtitle={search.trim() ? "Tente ajustar a busca." : "Não há solicitações pendentes no momento."}
            />
          </Card>
        ) : (
          <div className="grid md:grid-cols-2 gap-4">
            {pendentes.map((st) => {
              const selectable = selectMode && !st.isGrupo;
              return (
                <div key={st.id} className="relative">
                  {selectable && (
                    <button
                      type="button"
                      onClick={() => toggleSelect(st.id)}
                      className={`absolute top-3 right-3 z-10 w-6 h-6 rounded-md border-2 flex items-center justify-center transition-colors ${
                        selectedIds.has(st.id) ? "bg-ink border-ink" : "bg-white border-line"
                      }`}
                    >
                      {selectedIds.has(st.id) && <Icon name="check" size={14} className="text-white" />}
                    </button>
                  )}
                  <div
                    className={selectable ? "cursor-pointer" : ""}
                    onClick={() => selectable && toggleSelect(st.id)}
                  >
                    <div className={selectedIds.has(st.id) ? "ring-2 ring-ink rounded-2xl" : ""}>
                      <STCard st={st} highlightNew>
                        <p className="text-xs text-muted truncate">{st.setorNome} · {st.solicitanteNome}</p>
                        <div className="flex flex-wrap gap-2 mt-1">
                          <Button variant="outline" size="sm" icon="map" onClick={(e) => { e.stopPropagation(); openRouteInMaps(st); }}>Abrir rota</Button>
                          <Button variant="brand" size="sm" icon="calendar-check" disabled={selectMode} onClick={(e) => { e.stopPropagation(); setManaging(st); }}>
                            Programar
                          </Button>
                        </div>
                      </STCard>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {selectMode && selectedIds.size > 0 && (
        <div className="fixed bottom-0 left-0 right-0 md:left-64 bg-ink text-white px-5 py-4 flex items-center justify-between gap-3 z-20 shadow-lg">
          <span className="text-sm font-medium">{selectedIds.size} selecionada(s)</span>
          <div className="flex items-center gap-3">
            <button onClick={exitSelectMode} className="text-sm text-white/70 hover:text-white transition-colors px-2 py-2">Cancelar</button>
            <Button variant="brand" size="sm" icon="layers" disabled={selectedIds.size < 2} onClick={() => setGroupModalOpen(true)}>
              Agrupar ({selectedIds.size})
            </Button>
          </div>
        </div>
      )}

      <Modal open={!!managing} onClose={() => setManaging(null)} title={managing ? `Programar ${managing.numero}` : ""}>
        {managing && <ManageSTForm st={managing} drivers={drivers} onSave={saveAssignment} onCancel={() => setManaging(null)} />}
      </Modal>

      <CreateGroupModal
        open={groupModalOpen}
        selecionadas={selecionadas}
        onClose={() => setGroupModalOpen(false)}
        onCreated={() => { setGroupModalOpen(false); exitSelectMode(); }}
      />
    </div>
  );
}

function useCollection(name, orderField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let unsub = () => {};
    const start = () => {
      const { db, collection, onSnapshot, query, orderBy } = window.ST.firebase;
      const q = orderField ? query(collection(db, name), orderBy(orderField)) : collection(db, name);
      unsub = onSnapshot(
        q,
        (snap) => {
          setData(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
          setLoading(false);
        },
        (err) => {
          console.error(`Erro ao ler ${name}:`, err);
          setLoading(false);
        }
      );
    };
    if (window.ST && window.ST.firebase) start();
    else window.addEventListener("st:firebase-ready", start, { once: true });
    return () => unsub();
  }, [name, orderField]);

  return { data, loading };
}

async function createDoc(collectionName, data) {
  const { db, collection, addDoc, serverTimestamp } = window.ST.firebase;
  return addDoc(collection(db, collectionName), { ...data, createdAt: serverTimestamp() });
}
async function updateDocById(collectionName, id, data) {
  const { db, doc, updateDoc, serverTimestamp } = window.ST.firebase;
  return updateDoc(doc(db, collectionName, id), { ...data, updatedAt: serverTimestamp() });
}
async function deleteDocById(collectionName, id) {
  const { db, doc, deleteDoc } = window.ST.firebase;
  return deleteDoc(doc(db, collectionName, id));
}

/* ---------------------------------------------------------------
   UI — Modal, Select, Tabs (componentes de suporte aos cadastros)
--------------------------------------------------------------- */
function Modal({ open, onClose, title, children, footer, maxWidth = "max-w-md" }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative bg-white rounded-2xl shadow-lift w-full ${maxWidth} animate-fadeUp overflow-hidden max-h-[90vh] flex flex-col`}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-line shrink-0">
          <h3 className="font-display font-semibold text-sm">{title}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-lg hover:bg-mist flex items-center justify-center transition-colors">
            <Icon name="x" size={16} />
          </button>
        </div>
        <div className="p-5 overflow-y-auto">{children}</div>
        {footer && <div className="px-5 py-4 border-t border-line flex justify-end gap-2 shrink-0">{footer}</div>}
      </div>
    </div>
  );
}

function Select({ label, error, className = "", children, ...props }) {
  return (
    <label className="block">
      {label && <span className="block text-xs font-medium text-muted mb-1.5">{label}</span>}
      <select
        className={`w-full rounded-xl border bg-white text-sm px-3.5 py-2.5 ${
          error ? "border-brand" : "border-line"
        } focus:border-ink outline-none transition-colors ${className}`}
        {...props}
      >
        {children}
      </select>
      {error && <span className="block text-[11px] text-brand mt-1">{error}</span>}
    </label>
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div className="flex gap-1 bg-mist rounded-xl p-1 w-fit">
      {tabs.map((t) => (
        <button
          key={t.value}
          onClick={() => onChange(t.value)}
          className={`flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
            active === t.value ? "bg-white text-ink shadow-soft" : "text-muted hover:text-ink"
          }`}
        >
          {t.icon && <Icon name={t.icon} size={14} />}
          {t.label}
        </button>
      ))}
    </div>
  );
}

function ConfirmDialog({ open, onClose, onConfirm, title, message, loading }) {
  return (
    <Modal
      open={open}
      onClose={onClose}
      title={title || "Confirmar exclusão"}
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button variant="brand" onClick={onConfirm} disabled={loading}>
            {loading ? "Excluindo..." : "Excluir"}
          </Button>
        </>
      }
    >
      <p className="text-sm text-muted">{message || "Essa ação não pode ser desfeita. Deseja continuar?"}</p>
    </Modal>
  );
}

function DriversTab() {
  const { data: drivers, loading } = useCollection("drivers", "nome");
  const { data: vehicles } = useCollection("vehicles", "modelo");
  const { data: allSTs } = useAllSTs();
  const [modal, setModal] = useState(null); // null | 'create' | driver object
  const [saving, setSaving] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const toast = useToast();

  const vehicleName = (id) => vehicles.find((v) => v.id === id)?.modelo;
  const driversComRota = new Set(allSTs.filter((s) => s.motoristaId && s.status !== "finalizada").map((s) => s.motoristaId));

  const handleSubmit = async (form) => {
    setSaving(true);
    try {
      if (modal && modal.id) {
        await updateDocById("drivers", modal.id, form);
        toast.push({ type: "success", title: "Motorista atualizado" });
        setModal(null);
      } else {
        const ref = await createDoc("drivers", form);
        let credentialsMsg = "";
        try {
          const baseSlug = slugify(form.nome);
          let slug = baseSlug;
          let uid = null;
          for (let attempt = 1; attempt <= 5 && !uid; attempt++) {
            try {
              uid = await window.ST.firebase.createAuthAccountKeepSession(driverEmail(slug), toAuthPassword("1234"));
            } catch (authErr) {
              if (authErr.code === "auth/email-already-in-use") {
                attempt += 1;
                slug = `${baseSlug}-${attempt}`;
              } else {
                throw authErr;
              }
            }
          }
          if (!uid) throw new Error("Não foi possível gerar um login único para esse motorista.");
          const { db, doc, setDoc, serverTimestamp } = window.ST.firebase;
          await setDoc(doc(db, "users", uid), {
            role: "motorista",
            driverId: ref.id,
            nome: form.nome,
            telefone: form.telefone,
            mustChangePassword: true,
            createdAt: serverTimestamp(),
          });
          await updateDocById("drivers", ref.id, { authUid: uid, loginUsername: slug });
          credentialsMsg = `Login: ${slug} · Senha inicial: 1234`;
        } catch (authErr) {
          console.error("Erro ao criar login do motorista:", authErr);
          credentialsMsg = "Motorista salvo, mas houve erro ao criar o login — tente editar e salvar de novo.";
        }
        toast.push({ type: "success", title: "Motorista cadastrado", message: credentialsMsg, duration: 8000 });
        setModal(null);
      }
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao salvar", message: err.message });
    } finally {
      setSaving(false);
    }
  };

  const handleDelete = async () => {
    setDeleting(true);
    try {
      await deleteDocById("drivers", toDelete.id);
      toast.push({ type: "success", title: "Motorista removido" });
      setToDelete(null);
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao excluir", message: err.message });
    } finally {
      setDeleting(false);
    }
  };

  return (
    <>
      <div className="flex items-center justify-between mb-4">
        <p className="text-xs text-muted">{drivers.length} motorista(s) cadastrado(s)</p>
        <Button variant="brand" size="sm" icon="plus" onClick={() => setModal("create")}>Novo motorista</Button>
      </div>

      <Card className="divide-y divide-line">
        {loading ? (
          <div className="p-5 flex flex-col gap-3">
            <Skeleton className="h-12 w-full" />
            <Skeleton className="h-12 w-full" />
          </div>
        ) : drivers.length === 0 ? (
          <EmptyState icon="users" title="Nenhum motorista cadastrado" subtitle="Clique em “Novo motorista” para adicionar o primeiro." />
        ) : (
          drivers.map((d) => (
            <div key={d.id} className="p-4 flex items-center gap-4">
              <div className="w-10 h-10 rounded-full bg-mist flex items-center justify-center text-xs font-semibold shrink-0">
                {d.nome?.slice(0, 2).toUpperCase()}
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium text-ink truncate">{d.nome}</p>
                <p className="text-xs text-muted truncate">
                  {d.telefone} · CNH {d.categoria} · {vehicleName(d.veiculoPadrao) || "sem veículo padrão"}
                  {d.loginUsername && <span className="text-ink"> · login: {d.loginUsername}</span>}
                </p>
                <div className="mt-1"><DriverLocationBadge driver={d} /></div>
              </div>
              {driversComRota.has(d.id) ? (
                <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-500" /> Rota programada
                </span>
              ) : (
                <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" /> Disponível
                </span>
              )}
              <div className="flex items-center gap-1">
                <button onClick={() => setModal(d)} className="w-8 h-8 rounded-lg hover:bg-mist flex items-center justify-center transition-colors">
                  <Icon name="pencil" size={14} />
                </button>
                <button onClick={() => setToDelete(d)} className="w-8 h-8 rounded-lg hover:bg-brand-soft text-brand flex items-center justify-center transition-colors">
                  <Icon name="trash-2" size={14} />
                </button>
              </div>
            </div>
          ))
        )}
      </Card>

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal && modal.id ? "Editar motorista" : "Novo motorista"}>
        {modal && (
          <DriverForm
            initial={modal.id ? modal : null}
            vehicles={vehicles}
            saving={saving}
            onCancel={() => setModal(null)}
            onSubmit={handleSubmit}
          />
        )}
      </Modal>

      <ConfirmDialog
        open={!!toDelete}
        loading={deleting}
        onClose={() => setToDelete(null)}
        onConfirm={handleDelete}
        title="Excluir motorista"
        message={toDelete ? `Tem certeza que deseja excluir "${toDelete.nome}"? Essa ação não pode ser desfeita.` : ""}
      />
    </>
  );
}

function useAppUsers() {
  const { data, loading } = useCollection("users");
  return { data: data.filter((u) => u.role === "usuario"), loading };
}

function UserForm({ initial, onSubmit, onCancel, saving }) {
  const isEdit = !!initial;
  const [form, setForm] = useState(
    initial
      ? { nome: initial.nome, login: initial.login, setorSlug: initial.setorSlug }
      : { nome: "", login: "", setorSlug: DEPARTMENTS[0].slug, loginEdited: false }
  );
  const [errors, setErrors] = useState({});

  const setNome = (e) => {
    const nome = e.target.value;
    setForm((f) => ({ ...f, nome, login: f.loginEdited ? f.login : slugify(nome) }));
  };
  const setLogin = (e) => setForm((f) => ({ ...f, login: e.target.value, loginEdited: true }));
  const setSetor = (e) => setForm((f) => ({ ...f, setorSlug: e.target.value }));

  const validate = () => {
    const err = {};
    if (!form.nome.trim()) err.nome = "Informe o nome.";
    if (!isEdit && !slugify(form.login).trim()) err.login = "Informe um login.";
    if (!form.setorSlug) err.setorSlug = "Selecione o setor.";
    setErrors(err);
    return Object.keys(err).length === 0;
  };

  return (
    <div className="flex flex-col gap-4">
      <Input label="Nome completo" icon="user" value={form.nome} onChange={setNome} error={errors.nome} />
      <Input
        label={isEdit ? "Login (não pode ser alterado)" : "Login"}
        icon="at-sign"
        value={form.login}
        onChange={setLogin}
        error={errors.login}
        disabled={isEdit}
        className={isEdit ? "bg-mist text-muted" : ""}
      />
      <Select label="Setor" value={form.setorSlug} onChange={setSetor} error={errors.setorSlug}>
        {DEPARTMENTS.map((d) => <option key={d.slug} value={d.slug}>{d.nome}</option>)}
      </Select>
      {!isEdit && <p className="text-[11px] text-muted -mt-2">Senha inicial: <span className="st-number">1234</span> (a pessoa pode trocar depois no perfil).</p>}
      <div className="flex justify-end gap-2 mt-2">
        <Button variant="ghost" onClick={onCancel}>Cancelar</Button>
        <Button variant="brand" disabled={saving} onClick={() => validate() && onSubmit({ ...form, login: slugify(form.login) })}>
          {saving ? "Salvando..." : "Salvar usuário"}
        </Button>
      </div>
    </div>
  );
}

function ConsultaUserForm({ initial, onSubmit, onCancel, saving }) {
  const isEdit = !!initial;
  const [form, setForm] = useState(
    initial ? { nome: initial.nome, login: initial.login } : { nome: "", login: "", loginEdited: false }
  );
  const [errors, setErrors] = useState({});

  const setNome = (e) => {
    const nome = e.target.value;
    setForm((f) => ({ ...f, nome, login: f.loginEdited ? f.login : slugify(nome) }));
  };
  const setLogin = (e) => setForm((f) => ({ ...f, login: e.target.value, loginEdited: true }));

  const validate = () => {
    const err = {};
    if (!form.nome.trim()) err.nome = "Informe o nome.";
    if (!isEdit && !slugify(form.login).trim()) err.login = "Informe um login.";
    setErrors(err);
    return Object.keys(err).length === 0;
  };

  return (
    <div className="flex flex-col gap-4">
      <Input label="Nome completo" icon="user" value={form.nome} onChange={setNome} error={errors.nome} />
      <Input
        label={isEdit ? "Login (não pode ser alterado)" : "Login"}
        icon="at-sign"
        value={form.login}
        onChange={setLogin}
        error={errors.login}
        disabled={isEdit}
        className={isEdit ? "bg-mist text-muted" : ""}
      />
      {!isEdit && <p className="text-[11px] text-muted -mt-2">Senha inicial: <span className="st-number">1234</span> (a pessoa pode trocar depois no perfil).</p>}
      <div className="flex justify-end gap-2 mt-2">
        <Button variant="ghost" onClick={onCancel}>Cancelar</Button>
        <Button variant="brand" disabled={saving} onClick={() => validate() && onSubmit({ ...form, login: slugify(form.login) })}>
          {saving ? "Salvando..." : "Salvar acesso"}
        </Button>
      </div>
    </div>
  );
}

const TIPO_DEMANDA_OPTIONS = [
  { value: "coleta", label: "Coleta" },
  { value: "entrega", label: "Entrega" },
  { value: "coleta_entrega", label: "Coleta + Entrega" },
  { value: "terceiro_coleta", label: "Terceiro/Coleta" },
  { value: "terceiro_entrega", label: "Terceiro/Entrega" },
  { value: "outro", label: "Outro" },
];
function isTerceiroDemanda(tipo) {
  return tipo === "terceiro_coleta" || tipo === "terceiro_entrega";
}
const VEICULO_OPTIONS = ["Iveco Tector", "Iveco Daily", "Fiat Strada", "Ford Ka", "Carreta", "Prancha", "Não sei informar", "Outro"];

async function getNextSTNumber() {
  const { db, doc, runTransaction } = window.ST.firebase;
  const counterRef = doc(db, "settings", "st_counter");
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? snap.data().seq || 0 : 0;
    const next = current + 1;
    tx.set(counterRef, { seq: next }, { merge: true });
    return "ST" + String(next).padStart(6, "0");
  });
}

/* ---------------------------------------------------------------
   ST-GRUPO — junta várias STs do mesmo fornecedor/local numa única
   "ST" pro motorista, pra ele não ter que iniciar/finalizar STs
   separadas no mesmo lugar. As STs originais ficam com grupoId
   apontando pro grupo e saem das listas normais (useAllSTs já
   filtra isso) até serem "soltas" de volta (ver finalizarGrupoSTs).
--------------------------------------------------------------- */
async function getNextGroupNumber() {
  const { db, doc, runTransaction } = window.ST.firebase;
  const counterRef = doc(db, "settings", "st_grupo_counter");
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? snap.data().seq || 0 : 0;
    const next = current + 1;
    tx.set(counterRef, { seq: next }, { merge: true });
    return "GRUPO" + String(next).padStart(5, "0");
  });
}

const PRIORIDADE_ORDEM = { urgente: 3, alta: 2, normal: 1, baixa: 0 };

async function createSTGroup(nomeGrupo, selecionadas, usuarioNome) {
  const { db, doc, setDoc, updateDoc, serverTimestamp } = window.ST.firebase;
  const numero = await getNextGroupNumber();
  const first = selecionadas[0];

  const maiorPrioridade = selecionadas.reduce(
    (max, s) => ((PRIORIDADE_ORDEM[s.prioridade] || 0) > (PRIORIDADE_ORDEM[max] || 0) ? s.prioridade : max),
    first.prioridade || "normal"
  );
  const menorData = selecionadas.reduce(
    (min, s) => (s.dataDesejada && (!min || s.dataDesejada < min) ? s.dataDesejada : min),
    first.dataDesejada || ""
  );

  const groupDoc = {
    numero,
    isGrupo: true,
    stsIds: selecionadas.map((s) => s.id),
    fornecedorDestino: nomeGrupo,
    cidade: first.cidade || "",
    bairro: first.bairro || "",
    rua: first.rua || "",
    numeroEndereco: first.numeroEndereco || "",
    enderecoCompleto: first.enderecoCompleto || "",
    setorNome: "Grupo",
    setorSlug: null,
    solicitanteNome: `${selecionadas.length} solicitação(ões) agrupadas`,
    criadoPorNome: usuarioNome,
    tipoDemanda: first.tipoDemanda || "coleta",
    prioridade: maiorPrioridade,
    status: "solicitacao",
    dataDesejada: menorData,
    horario: first.horario || "",
    materiais: [],
    createdAt: serverTimestamp(),
  };

  await setDoc(doc(db, "transport_requests", numero), groupDoc);

  await Promise.all(
    selecionadas.map(async (s) => {
      await updateDoc(doc(db, "transport_requests", s.id), {
        grupoId: numero,
        coletado: false,
        motoristaId: null,
        motoristaNome: null,
      });
      await addTimelineEntry(s.numero, usuarioNome, `${usuarioNome} incluiu essa ST no grupo ${numero} — ${nomeGrupo}`);
    })
  );
  await addTimelineEntry(numero, usuarioNome, `${usuarioNome} criou o grupo com ${selecionadas.length} solicitação(ões) — ${nomeGrupo}`);

  return numero;
}

// adiciona STs pendentes a um grupo que já existe — útil quando alguém
// esqueceu de incluir uma solicitação na hora de montar o grupo
async function addSTsToGroup(group, stsToAdd, usuarioNome) {
  const { db, doc, updateDoc } = window.ST.firebase;
  await Promise.all(
    stsToAdd.map(async (s) => {
      await updateDoc(doc(db, "transport_requests", s.id), {
        grupoId: group.id,
        coletado: false,
        motoristaId: null,
        motoristaNome: null,
      });
      await addTimelineEntry(s.numero, usuarioNome, `${usuarioNome} incluiu essa ST no grupo ${group.numero}`);
    })
  );
  const novoStsIds = Array.from(new Set([...(group.stsIds || []), ...stsToAdd.map((s) => s.id)]));
  await updateDoc(doc(db, "transport_requests", group.id), { stsIds: novoStsIds });
  await addTimelineEntry(group.numero, usuarioNome, `${usuarioNome} adicionou ${stsToAdd.length} solicitação(ões) ao grupo`);
}

// solta uma ST de volta pra lista normal, sem reagendamento — ela some do
// grupo e volta a aparecer sozinha como antes de ser agrupada
async function removeSTFromGroup(group, st, usuarioNome) {
  const { db, doc, updateDoc } = window.ST.firebase;
  await updateDoc(doc(db, "transport_requests", st.id), { grupoId: null, coletado: false });
  await addTimelineEntry(st.numero, usuarioNome, `${usuarioNome} removeu essa ST do grupo ${group.numero}`);
  const novoStsIds = (group.stsIds || []).filter((id) => id !== st.id);
  await updateDoc(doc(db, "transport_requests", group.id), { stsIds: novoStsIds });
  await addTimelineEntry(group.numero, usuarioNome, `${usuarioNome} removeu ${st.numero} do grupo`);
}

// desmembra o grupo inteiro: solta TODAS as STs de volta pra lista normal
// (sem reagendamento, sem apagar nada delas) e só então apaga o grupo
async function ungroupAndDeleteGroup(group, usuarioNome) {
  const { db, doc, deleteDoc, updateDoc, collection, query, where, getDocs } = window.ST.firebase;
  const q = query(collection(db, "transport_requests"), where("grupoId", "==", group.id));
  const snap = await getDocs(q);
  await Promise.all(
    snap.docs.map((d) => updateDoc(doc(db, "transport_requests", d.id), { grupoId: null, coletado: false }))
  );
  await deleteDoc(doc(db, "transport_requests", group.id));
  await addTimelineEntry(
    group.numero,
    usuarioNome,
    `${usuarioNome} desmembrou o grupo — ${snap.docs.length} pedido(s) voltaram pra lista normal, nenhum foi excluído`
  );
  return snap.docs.length;
}

// chamado quando o motorista finaliza a rota de um ST-GRUPO inteiro:
// os pedidos marcados como coletados são finalizados individualmente;
// os que ficaram sem marcar voltam pra Programação como reagendamento.
async function finalizarGrupoSTs(grupo, motoristaNome) {
  const { db, doc, collection, query, where, getDocs, updateDoc } = window.ST.firebase;
  const q = query(collection(db, "transport_requests"), where("grupoId", "==", grupo.id));
  const snap = await getDocs(q);
  const pedidos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

  let coletados = 0;
  await Promise.all(
    pedidos.map(async (p) => {
      if (p.coletado) {
        coletados++;
        await updateDoc(doc(db, "transport_requests", p.id), {
          status: "finalizada",
          grupoId: null,
          vistoPelaLogistica: true,
        });
        await addTimelineEntry(p.numero, motoristaNome, `${motoristaNome} finalizou a entrega (coletada no grupo ${grupo.numero})`);
      } else {
        await updateDoc(doc(db, "transport_requests", p.id), {
          status: "solicitacao",
          grupoId: null,
          precisaReagendar: true,
          motivoNaoAtendida: `Não coletado durante a rota do grupo ${grupo.numero}`,
          motoristaId: null,
          motoristaNome: null,
        });
        await addTimelineEntry(p.numero, motoristaNome, `${motoristaNome} finalizou o grupo ${grupo.numero} sem coletar essa ST — precisa reagendar`);
        if (p.setorSlug) {
          await createNotification("setor", p.setorSlug, p.numero, `Sua ST ${p.numero} não foi coletada no grupo ${grupo.numero} e precisa ser reagendada`);
        }
      }
    })
  );

  await updateDoc(doc(db, "transport_requests", grupo.id), { status: "finalizada" });
  await addTimelineEntry(
    grupo.numero,
    motoristaNome,
    `${motoristaNome} finalizou a rota do grupo — ${coletados} de ${pedidos.length} pedido(s) coletado(s)`
  );
  if (pedidos.length - coletados > 0) {
    await createNotification(
      "role",
      "logistica",
      grupo.numero,
      `Grupo ${grupo.numero} finalizado — ${pedidos.length - coletados} pedido(s) não coletado(s) e voltaram pra Programação`
    );
  }
  return { total: pedidos.length, coletados };
}

// Aplica motorista + status + dia + horário a uma ST — usada tanto em
// "Gerenciar" (Todas STs) quanto em "Programar" (Programação).
async function applySTAssignment(st, motoristaId, status, dataDesejada, horario, drivers) {
  const { db, doc, updateDoc } = window.ST.firebase;
  const driver = drivers.find((d) => d.id === motoristaId);

  // atribuir um motorista a uma ST que ainda está só "Solicitação" já conta
  // como tê-la programado — promove o status automaticamente nesse caso.
  let finalStatus = status;
  if (motoristaId && finalStatus === "solicitacao") {
    finalStatus = "programada";
  }

  const updates = {
    motoristaId: motoristaId || null,
    motoristaNome: driver ? driver.nome : null,
    status: finalStatus,
    vistoPelaLogistica: true,
  };
  if (horario) updates.horario = horario;
  const dateChanged = dataDesejada && st.dataDesejada && dataDesejada !== st.dataDesejada;
  if (dataDesejada) updates.dataDesejada = dataDesejada;
  if (dateChanged) {
    updates.reprogramacoes = [
      ...(st.reprogramacoes || []),
      { dataAnterior: st.dataDesejada, dataNova: dataDesejada, motivo: "Definido ao programar a rota", usuario: "Logística", registradoEm: new Date().toISOString() },
    ];
    // a ST foi reprogramada agora — o aviso de "não atendida" não faz mais sentido
    if (st.precisaReagendar) updates.precisaReagendar = false;
  }
  await updateDoc(doc(db, "transport_requests", st.id), updates);
  await addTimelineEntry(
    st.numero,
    "Logística",
    `Logística programou a ST${driver ? ` — motorista: ${driver.nome}` : ""}${dataDesejada ? `, dia: ${dataDesejada}` : ""}${horario ? `, horário: ${horario}` : ""} (status: ${STATUS_MAP[finalStatus].label})`
  );
  if (finalStatus === "programada" && st.status !== "programada" && st.setorSlug) {
    await createNotification(
      "setor",
      st.setorSlug,
      st.numero,
      `Sua ST ${st.numero} foi programada${driver ? ` — motorista: ${driver.nome}` : ""}${dataDesejada ? ` para ${dataDesejada}` : ""}`
    );
  }
  return driver;
}

function useTimeline(stId) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!stId) { setLoading(false); return; }
    let unsub = () => {};
    const start = () => {
      const { db, collection, query, where, onSnapshot } = window.ST.firebase;
      const q = query(collection(db, "timeline"), where("stId", "==", stId));
      unsub = onSnapshot(
        q,
        (snap) => {
          const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          rows.sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
          setData(rows);
          setLoading(false);
        },
        () => setLoading(false)
      );
    };
    if (window.ST && window.ST.firebase) start();
    else window.addEventListener("st:firebase-ready", start, { once: true });
    return () => unsub();
  }, [stId]);
  return { data, loading };
}

function formatTimelineDate(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function exportPDF(rows, filtersLabel) {
  if (!window.jspdf) {
    alert("A biblioteca de PDF não carregou — verifique sua conexão e tente de novo.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });
  const marginX = 10;
  let y = 15;

  doc.setFontSize(14);
  doc.text("Relatório de Solicitações de Transporte — ST Logística", marginX, y);
  y += 6;
  doc.setFontSize(8);
  doc.text(filtersLabel, marginX, y);
  y += 4;
  doc.text(`Gerado em ${new Date().toLocaleString("pt-BR")} — ${rows.length} registro(s)`, marginX, y);
  y += 8;

  const columns = [
    { label: "Número", key: "numero", w: 18 },
    { label: "Setor", key: "setorNome", w: 22 },
    { label: "Usuário", key: "criadoPorNome", w: 22 },
    { label: "Fornecedor/Destino", key: "fornecedorDestino", w: 42 },
    { label: "Cidade", key: "cidade", w: 22 },
    { label: "Motorista", key: "motoristaNome", w: 26 },
    { label: "Status", key: "statusLabel", w: 20 },
    { label: "Prioridade", key: "prioridadeLabel", w: 20 },
    { label: "Data original", key: "dataOriginal", w: 20 },
    { label: "Data atual", key: "dataDesejada", w: 20 },
    { label: "Reprog.", key: "qtdReprogramacoes", w: 14 },
  ];
  const pageHeight = doc.internal.pageSize.getHeight();
  const rowHeight = 6.5;

  function drawHeader() {
    doc.setFontSize(8);
    doc.setFont(undefined, "bold");
    let x = marginX;
    columns.forEach((c) => { doc.text(c.label, x, y); x += c.w; });
    y += 2;
    doc.setLineWidth(0.2);
    doc.line(marginX, y, marginX + columns.reduce((s, c) => s + c.w, 0), y);
    y += 5;
    doc.setFont(undefined, "normal");
  }

  drawHeader();
  rows.forEach((r) => {
    if (y > pageHeight - 15) {
      doc.addPage();
      y = 15;
      drawHeader();
    }
    let x = marginX;
    columns.forEach((c) => {
      const text = String(r[c.key] ?? "-").slice(0, 42);
      doc.text(text, x, y);
      x += c.w;
    });
    y += rowHeight;
  });

  doc.save(`relatorio-sts-${Date.now()}.pdf`);
}

function exportCSV(rows) {
  const headers = ["Numero", "Setor", "Usuario", "Fornecedor", "Cidade", "Bairro", "Motorista", "Status", "Prioridade", "DataOriginal", "DataDesejadaAtual", "QtdReprogramacoes", "UltimaReprogramacao", "Veiculo", "NotaFiscal"];
  const escape = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.join(";")];
  rows.forEach((r) => {
    lines.push(
      [r.numero, r.setorNome, r.criadoPorNome || "", r.fornecedorDestino, r.cidade, r.bairro, r.motoristaNome || "", r.statusLabel, r.prioridadeLabel, r.dataOriginal || "", r.dataDesejada || "", r.qtdReprogramacoes, r.ultimaReprogramacao || "", r.veiculoIndicado || "", r.notaFiscal || ""]
        .map(escape)
        .join(";")
    );
  });
  const csvContent = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `relatorio-sts-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

const PRIORITY_RANK = { emergencial: 0, alta: 1, media: 2, baixa: 3 };

function sortQueue(sts) {
  return [...sts].sort((a, b) => {
    const ao = a.ordem ?? 999999;
    const bo = b.ordem ?? 999999;
    if (ao !== bo) return ao - bo;
    const pa = PRIORITY_RANK[a.prioridade] ?? 9;
    const pb = PRIORITY_RANK[b.prioridade] ?? 9;
    if (pa !== pb) return pa - pb;
    return (a.numero || "").localeCompare(b.numero || "");
  });
}

    const novaData = e.target.value;
    setValue(novaData);
    if (!novaData || novaData === st.dataDesejada) return;
    setSaving(true);
    try {
      const { db, doc, updateDoc } = window.ST.firebase;
      const updates = { dataDesejada: novaData };
      if (st.dataDesejada) {
        updates.reprogramacoes = [
          ...(st.reprogramacoes || []),
          { dataAnterior: st.dataDesejada, dataNova: novaData, motivo: "Definido no Planejamento de Rotas", usuario: "Logística", registradoEm: new Date().toISOString() },
        ];
      }
      await updateDoc(doc(db, "transport_requests", st.id), updates);
      await addTimelineEntry(
        st.numero,
        "Logística",
        st.dataDesejada ? `Logística reprogramou a ST de ${st.dataDesejada} para ${novaData}` : `Logística definiu a data desejada: ${novaData}`
      );
      toast.push({ type: "success", title: "Data atualizada" });
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao salvar data", message: err.message });
    } finally {
      setSaving(false);
    }
  };

  return (
    <label
      className="flex items-center gap-1.5 text-[11px] text-muted shrink-0"
      onMouseDown={(e) => e.stopPropagation()}
      onClick={(e) => e.stopPropagation()}
      draggable={false}
    >
      <Icon name="calendar" size={12} />
      <input
        type="date"
        value={value}
        onChange={handleChange}
        disabled={saving}
        className="text-[11px] border border-line rounded-md px-1.5 py-1 bg-white outline-none focus:border-ink"
      />
    </label>
  );
}

const WEEKDAY_LABELS_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

function isoDateFrom(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// segunda a domingo da semana atual, com data e dia da semana já formatados
function getCurrentWeekDates() {
  const today = new Date();
  const dow = today.getDay(); // 0 (dom) .. 6 (sáb)
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(today);
  monday.setDate(today.getDate() + diffToMonday);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = isoDateFrom(d);
    days.push({
      iso,
      weekday: WEEKDAY_LABELS_SHORT[d.getDay()],
      dateLabel: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`,
      isToday: iso === isoDateFrom(new Date()),
    });
  }
  return days;
}

function DayFilterStrip({ value, onChange, atrasadasCount }) {
  const days = getCurrentWeekDates();
  // se a data selecionada (ex: vinda do Calendário) não está na semana atual, mostra um chip extra pra ela
  const isKnownValue = value === "todas" || value === "atrasadas" || days.some((d) => d.iso === value);
  const extraDate = !isKnownValue && /^\d{4}-\d{2}-\d{2}$/.test(value)
    ? (() => {
        const [y, m, d] = value.split("-").map(Number);
        const dt = new Date(y, m - 1, d);
        return { iso: value, weekday: WEEKDAY_LABELS_SHORT[dt.getDay()], dateLabel: `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}` };
      })()
    : null;
  return (
    <div className="flex gap-2 overflow-x-auto pb-1">
      <button
        onClick={() => onChange("todas")}
        className={`shrink-0 px-4 py-2.5 rounded-xl text-sm font-medium transition-colors border ${

        }`}

        Todas

      {atrasadasCount > 0 && (
        <button
          onClick={() => onChange("atrasadas")}
          className={`shrink-0 flex flex-col items-center justify-center px-4 py-1.5 rounded-xl text-xs font-medium transition-colors border ${
            value === "atrasadas" ? "bg-brand text-white border-brand" : "bg-brand-soft text-brand border-brand/30 hover:border-brand"
          }`}

          <span>Atrasadas</span>

        </button>
      )}
      {extraDate && (
        <button
          onClick={() => onChange(extraDate.iso)}
          className="shrink-0 flex flex-col items-center justify-center px-4 py-1.5 rounded-xl text-xs font-medium transition-colors border bg-ink text-white border-ink"
        >
          <span>{extraDate.weekday} · escolhida</span>

      )}

            value === d.iso
              ? "bg-ink text-white border-ink"
              : d.isToday
              ? "bg-brand-soft text-brand border-brand/30 hover:border-brand"
              : "bg-white text-muted border-line hover:border-ink"
          }`}
        >
          <span>{d.weekday}{d.isToday ? " · hoje" : ""}</span>
          <span className="st-number">{d.dateLabel}</span>
        </button>
      ))}
    </div>
  );
}

function getMonthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay(); // 0 dom .. 6 sáb
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startWeekday - 1; i >= 0; i--) {
    cells.push({ day: daysInPrevMonth - i, currentMonth: false, iso: null });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, currentMonth: true, iso: `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    cells.push({ day: nextDay++, currentMonth: false, iso: null });
  }
  return cells;
}

    (s) => s.status !== "finalizada" && s.dataDesejada && s.dataDesejada < todayISODate()
  ).length;

    dayFilter === "todas"

/* ---------------------------------------------------------------
   IMPORTAÇÃO DE ITENS A PARTIR DO PDF DO PEDIDO DE COMPRAS
   Nesse relatório, cada linha da tabela vem com as colunas coladas
   (descrição, unidade e valores sem separação clara no texto), e a
   descrição às vezes quebra numa segunda linha por baixo. Por isso,
   em vez de tentar separar por texto, localizamos a coluna
   "Descricao" pela posição (x) do próprio cabeçalho da tabela e
   pegamos só os fragmentos de texto que caem dentro dessa faixa de
   posição — o que funciona com qualquer conteúdo escrito ali,
   independente do texto específico de cada PDF.
--------------------------------------------------------------- */
async function extractMateriaisFromPedidoComprasPDF(file) {
  if (!window.pdfjsLib) throw new Error("Leitor de PDF não carregou (bloqueio de rede?).");
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

  const words = []; // { x, y, str, page }
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    content.items.forEach((it) => {
      const str = (it.str || "").trim();
      if (!str) return;
      words.push({ x: it.transform[4], y: Math.round(it.transform[5]), str, page: p });
    });
  }

  // acha o cabeçalho "Descricao" da tabela pra saber onde essa coluna
  // começa (e onde termina — início da próxima coluna, "U")
  const header = words.find((w) => /^descri[cç][aã]o/i.test(w.str));
  if (!header) return [];
  const headerRow = words.filter((w) => w.page === header.page && w.y === header.y).sort((a, b) => a.x - b.x);
  const headerPos = headerRow.findIndex((w) => w.x === header.x && w.str === header.str);
  const nextHeader = headerRow[headerPos + 1];
  const colStart = header.x - 6;
  const colEnd = nextHeader ? nextHeader.x - 3 : header.x + 200;

  const byPage = {};
  words.forEach((w) => { (byPage[w.page] = byPage[w.page] || []).push(w); });

  const items = [];
  let current = null;

  Object.keys(byPage)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach((pageNum) => {
      const rows = {};
      byPage[pageNum].forEach((w) => { (rows[w.y] = rows[w.y] || []).push(w); });
      Object.keys(rows)
        .map(Number)
        .sort((a, b) => b - a) // topo → base da página
        .forEach((y) => {
          const row = rows[y].sort((a, b) => a.x - b.x);
          if (row.some((w) => /^descri[cç][aã]o/i.test(w.str))) return; // é o próprio cabeçalho

          const isItemRow = /^\d{3}$/.test(row[0].str) && row[1] && /^\d{5,}$/.test(row[1].str);
          const leftmostX = row[0].x;

          const descText = row
            .filter((w) => w.x >= colStart && w.x < colEnd)
            .map((w) => w.str)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();

          if (isItemRow) {
            if (current) items.push(current);
            current = descText;
          } else if (current !== null && leftmostX >= colStart && leftmostX < colEnd && descText) {
            // linha de continuação: a descrição quebrou e o item aparece embaixo,
            // sem nada nas colunas "Ite"/"Produto" à esquerda
            current += " " + descText;
          }
        });
    });

  if (current) items.push(current);

  return items.map((s) => s.replace(/\s+/g, " ").trim()).filter(Boolean);
}

function MaterialListInput({ materiais, onChange, error }) {
  const update = (id, key, value) => onChange(materiais.map((m) => (m.id === id ? { ...m, [key]: value } : m)));
  const add = () => onChange([...materiais, { id: rid(), descricao: "", quantidade: "", peso: "" }]);
  const remove = (id) => onChange(materiais.length > 1 ? materiais.filter((m) => m.id !== id) : materiais);

  return (
    <div className="flex flex-col gap-3">
      <div className="flex items-center justify-between">
        <span className="block text-xs font-medium text-muted">Materiais</span>
        <Button type="button" variant="ghost" size="sm" icon="plus" onClick={add}>Adicionar material</Button>
      </div>
      {materiais.map((m, idx) => (
        <div key={m.id} className="grid grid-cols-[1fr_110px_110px_36px] gap-2 items-end">
          <Input label={idx === 0 ? "Descrição" : undefined} value={m.descricao} onChange={(e) => update(m.id, "descricao", e.target.value)} placeholder="Descrição do material" />
          <Input label={idx === 0 ? "Qtd/volume" : undefined} value={m.quantidade} onChange={(e) => update(m.id, "quantidade", e.target.value)} placeholder="ex: 10 cx" />
          <Input label={idx === 0 ? "Peso aprox." : undefined} value={m.peso} onChange={(e) => update(m.id, "peso", e.target.value)} placeholder="ex: 50kg" />
          <button
            type="button"
            onClick={() => remove(m.id)}
            disabled={materiais.length === 1}
            className="w-9 h-9 rounded-lg hover:bg-brand-soft text-brand flex items-center justify-center disabled:opacity-30 disabled:pointer-events-none"
          >
            <Icon name="trash-2" size={14} />
          </button>
        </div>
      ))}
      {error && <span className="text-[11px] text-brand">{error}</span>}
    </div>
  );
}

function buildEnderecoCompleto(form) {
  return [form.rua + (form.numeroEndereco ? `, ${form.numeroEndereco}` : ""), form.bairro, form.cidade, form.cep].filter(Boolean).join(" - ");
}

async function uploadSTFiles(files, numero) {
  const { storage, storageRef, uploadBytes, getDownloadURL } = window.ST.firebase;
  const anexos = [];
  const falhas = [];
  for (const file of files) {
    try {
      const path = `attachments/${numero}/${Date.now()}-${file.name}`;
      const ref = storageRef(storage, path);
      const { ref: uploadedRef } = await uploadBytes(ref, file);
      const url = await getDownloadURL(uploadedRef);
      anexos.push({ nome: file.name, url, path });
    } catch (err) {
      console.error(`Erro ao enviar anexo "${file.name}":`, err);
      falhas.push(file.name);
    }
  }
  return { anexos, falhas };
}

function emptyMateriais() {
  return [{ id: rid(), descricao: "", quantidade: "", peso: "" }];
}

function materiaisFromST(st) {
  if (st.materiais && st.materiais.length) return st.materiais.map((m) => ({ id: m.id || rid(), ...m }));
  if (st.descricaoMaterial) return [{ id: rid(), descricao: st.descricaoMaterial, quantidade: st.quantidade || "", peso: st.pesoAproximado || "" }];
  return emptyMateriais();
}

    const file = e.target.files && e.target.files[0];
    e.target.value = "";

    setImportingPdf(true);
    try {
      const descricoes = await extractMateriaisFromPedidoComprasPDF(file);
      if (descricoes.length === 0) {
        toast.push({
          type: "error",
          title: "Nenhum item encontrado no PDF",
          message: "Não conseguimos identificar a coluna de Descrição nesse arquivo. Adicione os materiais manualmente.",
        });
        return;
      }
      setForm((f) => {
        const existentes = f.materiais.filter((m) => m.descricao.trim());
        const novos = descricoes.map((descricao) => ({ id: rid(), descricao, quantidade: "1", peso: "" }));
        return { ...f, materiais: [...existentes, ...novos] };
      });
      toast.push({ type: "success", title: `${descricoes.length} item(ns) importado(s) do PDF` });
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao ler o PDF", message: err.message });
    } finally {
      setImportingPdf(false);
    }
  };

  useEffect(() => {
    const digits = (form.cep || "").replace(/\D/g, "");

    let cancelled = false;
    (async () => {
      setBuscandoCep(true);
      try {
        const res = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
        const data = await res.json();
        if (cancelled) return;
        if (data.erro) {
          toast.push({ type: "error", title: "CEP não encontrado", message: "Confira o número ou preencha o endereço manualmente." });
