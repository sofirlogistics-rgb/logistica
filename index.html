function openRouteInMaps(st) {
  const q = encodeURIComponent(st.enderecoCompleto || st.cidade || "");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
}

// Abre uma rota com várias paradas de uma vez, na ordem passada (a mesma
// ordem já definida no Planejamento de Rotas / fila do motorista).
// Grátis — usa a URL pública do Google Maps, sem precisar de chave de API.
function openMultiStopRoute(stsOrdenadas, toast) {
  const enderecos = stsOrdenadas
    .map((st) => st.enderecoCompleto || st.cidade || "")
    .filter(Boolean)
    .map((e) => encodeURIComponent(e));

  if (enderecos.length === 0) {
    if (toast) toast.push({ type: "error", title: "Nenhum endereço disponível nessa fila" });
    return;
  }
  if (enderecos.length === 1) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${enderecos[0]}`, "_blank");
    return;
  }
  const limitado = enderecos.slice(0, 10);
  if (enderecos.length > 10 && toast) {
    toast.push({
      type: "error",
      title: "Rota com muitas paradas",
      message: "O Google Maps só aceita até 10 endereços de uma vez — abrindo as 10 primeiras da fila.",
      duration: 6000,
    });
  }
  window.open(`https://www.google.com/maps/dir/${limitado.join("/")}`, "_blank");
}

      await updateDoc(doc(db, "transport_requests", pedido.id), { coletado: !pedido.coletado });
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao atualizar", message: err.message });
    } finally {
      setSaving(null);
    }
  };

  const concluidosCount = pedidos.filter((p) => p.coletado).length;

  return (
    <Modal open={open} onClose={onClose} title={`Pedidos do grupo — ${groupNumero}`} maxWidth="max-w-lg">
      {loading ? (
        <div className="flex flex-col gap-2"><Skeleton className="h-16 w-full" /><Skeleton className="h-16 w-full" /></div>
      ) : pedidos.length === 0 ? (
        <p className="text-xs text-muted">Nenhum pedido nesse grupo.</p>
      ) : (
        <div className="flex flex-col gap-3">
          <p className="text-xs text-muted">
            <span className="font-semibold text-ink">{concluidosCount}</span> de {pedidos.length} coletado(s) — toque em um pedido pra marcar/desmarcar
          </p>
          <div className="flex flex-col gap-2">
            {pedidos.map((p) => {
              const materiais = p.materiais && p.materiais.length ? p.materiais : (p.descricaoMaterial ? [{ descricao: p.descricaoMaterial }] : []);
              return (
                <button
                  key={p.id}
                  type="button"
                  disabled={saving === p.id}
                  onClick={() => toggleColetado(p)}
                  className={`text-left border rounded-xl p-3 flex items-start gap-3 transition-colors ${
                    p.coletado ? "border-emerald-300 bg-emerald-50" : "border-line hover:border-ink"
                  }`}
                >
                  <div
                    className={`w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 mt-0.5 ${
                      p.coletado ? "bg-emerald-500 border-emerald-500" : "border-line bg-white"
                    }`}
                  >
                    {p.coletado && <Icon name="check" size={13} className="text-white" />}
                  </div>
                  <div className="min-w-0 flex-1">
                    <p className="text-sm font-semibold st-number">{p.numero}</p>
                    {materiais.length > 0 && (
                      <p className="text-xs text-muted truncate mt-0.5">
                        {materiais[0].descricao}
                        {materiais.length > 1 && ` +${materiais.length - 1} item(ns)`}
                      </p>
                    )}
                    {p.recebedorNome && <p className="text-[11px] text-muted mt-0.5">Recebe: {p.recebedorNome}</p>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ---------------------------------------------------------------
   EDITAR GRUPO — adicionar/remover STs de um ST-GRUPO já criado,
   pra corrigir caso alguém esqueça de incluir uma solicitação.
--------------------------------------------------------------- */
function EditGroupModal({ open, group, onClose, onUngrouped }) {
  const { profile } = useAuth();
  const { data: membros, loading } = useSTsWhere("grupoId", open && group ? group.id : null);
  const { data: allSTs } = useAllSTs();
  const [search, setSearch] = useState("");
  const [selectedToAdd, setSelectedToAdd] = useState(() => new Set());
  const [saving, setSaving] = useState(false);
  const [confirmingUngroup, setConfirmingUngroup] = useState(false);
  const [ungrouping, setUngrouping] = useState(false);
  const toast = useToast();

  useEffect(() => {
    if (!open) {
      setSearch("");
      setSelectedToAdd(new Set());
      setConfirmingUngroup(false);
    }
  }, [open]);

  const candidatos = allSTs
    .filter((s) => !s.isGrupo && s.status === "solicitacao" && (!group || s.id !== group.id))
    .filter((s) => {
      if (!search.trim()) return true;
      const q = search.trim().toLowerCase();
      return [s.numero, s.fornecedorDestino, s.cidade].some((v) => (v || "").toLowerCase().includes(q));
    });

  const toggleAdd = (id) => {
    setSelectedToAdd((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const handleAdd = async () => {
    const stsToAdd = candidatos.filter((s) => selectedToAdd.has(s.id));
    if (stsToAdd.length === 0) return;
    setSaving(true);
    try {
      await addSTsToGroup(group, stsToAdd, profile.nome || "Logística");
      toast.push({ type: "success", title: `${stsToAdd.length} ST(s) adicionada(s) ao grupo` });
      setSelectedToAdd(new Set());
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao adicionar", message: err.message });
    } finally {
      setSaving(false);
    }
  };

  const handleRemove = async (st) => {
    setSaving(true);
    try {
      await removeSTFromGroup(group, st, profile.nome || "Logística");
      toast.push({ type: "success", title: `${st.numero} removida do grupo` });
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao remover", message: err.message });
    } finally {
      setSaving(false);
    }
  };

  const handleUngroup = async () => {
    setUngrouping(true);
    try {
      const total = await ungroupAndDeleteGroup(group, profile.nome || "Logística");
      toast.push({ type: "success", title: `Grupo ${group.numero} desmembrado`, message: `${total} pedido(s) voltaram pra lista normal — nada foi excluído.` });
      setConfirmingUngroup(false);
      onClose();
      onUngrouped && onUngrouped();
    } catch (err) {
      toast.push({ type: "error", title: "Erro ao desmembrar", message: err.message });
    } finally {
      setUngrouping(false);
    }
  };

  if (!group) return null;

  return (
    <>
      <Modal open={open} onClose={onClose} title={`Editar grupo — ${group.numero}`} maxWidth="max-w-lg">
        <div className="flex flex-col gap-5">
          <div>
            <p className="text-xs font-medium text-muted mb-2">Pedidos no grupo ({membros.length})</p>
            {loading ? (
              <Skeleton className="h-20 w-full" />
            ) : membros.length === 0 ? (
              <p className="text-xs text-muted">Nenhum pedido nesse grupo ainda.</p>
            ) : (
              <div className="flex flex-col gap-2">
                {membros.map((m) => (
                  <div key={m.id} className="border border-line rounded-lg px-3 py-2 flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <p className="text-sm st-number font-medium">{m.numero}</p>
                      <p className="text-xs text-muted truncate">{m.fornecedorDestino}</p>
                    </div>
                    <button
                      disabled={saving}
                      onClick={() => handleRemove(m)}
                      className="text-xs text-brand hover:bg-brand-soft px-2 py-1.5 rounded-lg transition-colors shrink-0 flex items-center gap-1"
                    >
                      <Icon name="x" size={12} /> Remover
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="border-t border-line pt-4">
            <p className="text-xs font-medium text-muted mb-2">Adicionar STs pendentes ao grupo</p>
            <Input icon="search" placeholder="Buscar por nº, fornecedor, cidade..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <div className="flex flex-col gap-2 mt-3 max-h-52 overflow-y-auto">
              {candidatos.length === 0 ? (
                <p className="text-xs text-muted">Nenhuma ST pendente disponível pra adicionar.</p>
              ) : (
                candidatos.map((s) => (
                  <button
                    key={s.id}
                    type="button"
                    onClick={() => toggleAdd(s.id)}
                    className={`text-left border rounded-lg px-3 py-2 flex items-center justify-between gap-2 transition-colors ${
                      selectedToAdd.has(s.id) ? "border-ink bg-mist" : "border-line hover:border-ink"
                    }`}
                  >
                    <div className="min-w-0">
                      <p className="text-sm st-number font-medium">{s.numero}</p>
                      <p className="text-xs text-muted truncate">{s.fornecedorDestino} · {s.cidade}</p>
                    </div>
                    <div
                      className={`w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${
                        selectedToAdd.has(s.id) ? "bg-ink border-ink" : "border-line bg-white"
                      }`}
                    >
                      {selectedToAdd.has(s.id) && <Icon name="check" size={12} className="text-white" />}
                    </div>
                  </button>
                ))
              )}
            </div>
            <Button variant="brand" size="sm" icon="plus" className="mt-3 w-full justify-center" disabled={saving || selectedToAdd.size === 0} onClick={handleAdd}>
              {saving ? "Adicionando..." : `Adicionar${selectedToAdd.size > 0 ? ` (${selectedToAdd.size})` : ""}`}
            </Button>
          </div>

          <div className="border-t border-line pt-4">
            <Button variant="outline" size="sm" icon="split" className="w-full justify-center text-brand border-brand/30 hover:border-brand" onClick={() => setConfirmingUngroup(true)}>
              Desmembrar grupo
            </Button>
            <p className="text-[11px] text-muted mt-1.5 text-center">As STs não são excluídas — só a junção deixa de existir.</p>
          </div>
        </div>
      </Modal>
      <ConfirmDialog
        open={confirmingUngroup}
        loading={ungrouping}
        onClose={() => setConfirmingUngroup(false)}
        onConfirm={handleUngroup}
        title="Desmembrar grupo"
        message={`Tem certeza que deseja desmembrar o grupo ${group.numero}? As STs que estão dentro dele NÃO são excluídas — elas voltam a aparecer sozinhas, como estavam antes de entrar no grupo.`}
      />
    </>
  );
}

  const [showPedidos, setShowPedidos] = useState(false);

  return (
    <Card className={`p-4 flex flex-col gap-3 ${st.precisaReagendar ? "border-2 border-brand" : st.isGrupo ? "border-2 border-ink" : isTerceiro ? "border-2 border-blue-300" : ""}`}>

        <div className="bg-ink text-white text-[11px] font-semibold px-3 py-2 rounded-lg flex items-center gap-2 -m-1 mb-0">
          <Icon name="layers" size={13} className="shrink-0" />

          <Icon name="calendar-x" size={13} className="shrink-0 mt-0.5" />

            Não atendida — motorista não conseguiu concluir. Precisa reagendar.
            {st.motivoNaoAtendida && <span className="block font-normal mt-0.5">Motivo: {st.motivoNaoAtendida}</span>}
          </span>
        </div>
      )}
      {isTerceiro && !st.precisaReagendar && (
        <div className="bg-blue-50 text-blue-700 text-[11px] font-semibold px-3 py-2 rounded-lg flex items-center gap-2 -m-1 mb-0">

          Transporte por terceiro{st.transportadora ? ` — ${st.transportadora}` : " — transportadora a definir"}
        </div>
      )}
      <div className="flex items-start justify-between gap-3">
        <div>
          <p className="text-sm font-semibold st-number flex items-center gap-1.5">
            {st.numero}
            {st.isGrupo && <span className="text-[9px] font-bold bg-ink text-white px-1.5 py-0.5 rounded">GRUPO</span>}

          <PriorityTag level={st.prioridade} />

      </div>
      <RouteProgress status={st.status} compact precisaReagendar={st.precisaReagendar} />
      {st.isGrupo && (
        <button
          type="button"
          onClick={() => setShowPedidos(true)}
          className="text-xs text-left flex items-center gap-1.5 min-w-0 group"
        >
          <Icon name="list-checks" size={12} className="shrink-0 text-ink" />
          <span className="font-semibold text-ink underline decoration-dotted underline-offset-2 group-hover:text-brand shrink-0">Pedidos</span>
          <span className="text-muted truncate">— {st.stsIds ? st.stsIds.length : 0} solicitação(ões) nesse grupo</span>
        </button>
      )}
      {(materiais.length > 0 || st.pedidosCompra) && (
        <div className="flex items-center gap-2 min-w-0">
          {materiais.length > 0 && (
            <button
              type="button"
              onClick={() => setShowMateriais(true)}
              className="text-xs text-left flex items-center gap-1.5 min-w-0 group flex-1"
            >
              <Icon name="package" size={12} className="shrink-0 text-ink" />
              <span className="font-semibold text-ink underline decoration-dotted underline-offset-2 group-hover:text-brand shrink-0">Descrição</span>
              <span className="text-muted truncate">
                — {materiais[0].descricao}
                {materiais.length > 1 && ` +${materiais.length - 1} item(ns)`}
              </span>
            </button>
          )}
          {st.pedidosCompra && (
            <span className="text-[11px] text-muted bg-mist px-2 py-1 rounded-md shrink-0 flex items-center gap-1">
              <Icon name="hash" size={11} />
              {st.pedidosCompra}
            </span>
          )}
        </div>
      )}
      {st.observacoes && (
        <p className="text-xs text-muted italic truncate">
          <Icon name="message-square" size={12} className="inline mr-1 -mt-0.5" />
          {st.observacoes}
        </p>
      )}
      <div className="text-xs text-muted flex flex-wrap gap-x-4 gap-y-1">
        <span className="flex items-center gap-1"><Icon name="map-pin" size={12} />{st.cidade}</span>
        {st.motoristaNome && <span className="flex items-center gap-1"><Icon name="truck" size={12} />{st.motoristaNome}</span>}
        {st.dataDesejada && <span className="flex items-center gap-1"><Icon name="calendar" size={12} />{st.dataDesejada}</span>}
        {st.horario && <span className="flex items-center gap-1"><Icon name="clock" size={12} />{st.horario}</span>}
        {st.criadoPorNome && <span className="flex items-center gap-1"><Icon name="user" size={12} />{st.criadoPorNome}</span>}

        <div className="text-[11px] text-muted bg-mist rounded-lg px-2.5 py-1.5 flex flex-wrap items-center gap-1">
          <Icon name="history" size={12} className="text-brand shrink-0" />
          <span className="text-ink font-medium st-number">{reprogramacoes[0].dataAnterior}</span>
          {reprogramacoes.map((r, i) => (
            <span key={i} className="flex items-center gap-1">
              <Icon name="arrow-right" size={10} />
              <span className={i === reprogramacoes.length - 1 ? "text-brand font-medium st-number" : "text-muted st-number"}>{r.dataNova}</span>
            </span>
          ))}
        </div>
      )}
      {st.anexos && st.anexos.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {st.anexos.map((a) => <AttachmentThumb key={a.path} url={a.url} nome={a.nome} />)}
        </div>
      )}
      {children}
      <Modal open={showMateriais} onClose={() => setShowMateriais(false)} title={`Descrição — ${st.numero}`} maxWidth="max-w-lg">
        <div className="flex flex-col gap-4">
          {st.recebedorNome && (
            <div className="bg-mist rounded-xl p-3 flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-full bg-ink text-white flex items-center justify-center shrink-0">
                <Icon name="user-check" size={15} />
              </div>
              <div className="min-w-0">
                <p className="text-[11px] text-muted">Quem vai receber</p>
                <p className="text-sm font-semibold text-ink truncate">{st.recebedorNome}</p>
              </div>
            </div>
          )}
          <div className="flex flex-col gap-2">
            <p className="text-xs font-medium text-muted">O que buscar/levar ({materiais.length})</p>
            {materiais.map((m, i) => (
              <div key={i} className="border border-line rounded-lg p-3 flex items-start gap-2.5">
                <Icon name="package" size={14} className="text-brand mt-0.5 shrink-0" />
                <div className="min-w-0">
                  <p className="text-sm text-ink">{m.descricao}</p>
                  {(m.quantidade || m.peso) && (
                    <p className="text-[11px] text-muted mt-0.5">
                      {m.quantidade && `Qtd/volume: ${m.quantidade}`}
                      {m.quantidade && m.peso ? " · " : ""}
                      {m.peso && `Peso aprox.: ${m.peso}`}
                    </p>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      </Modal>
      {st.isGrupo && <GroupPedidosModal groupId={st.id} groupNumero={st.numero} open={showPedidos} onClose={() => setShowPedidos(false)} />}
    </Card>
  );
}

function MinhasSTsPage() {
  const { user, profile } = useAuth();
  const { data: sts, loading } = useSTsWhere("criadoPorUid", user?.uid);
  const { data: drivers } = useCollection("drivers", "nome");
  const [editing, setEditing] = useState(null);
  const [historyItem, setHistoryItem] = useState(null);
  const [filterStatus, setFilterStatus] = useState("todas");
  const [search, setSearch] = useState("");
  const [filterMotorista, setFilterMotorista] = useState("");
  const [dataInicio, setDataInicio] = useState("");
  const [dataFim, setDataFim] = useState("");

  const hasActiveFilters = search.trim() || filterMotorista || dataInicio || dataFim;

  const filtered = sts
    .filter((s) => filterStatus === "todas" || s.status === filterStatus)
    .filter((s) => !filterMotorista || s.motoristaId === filterMotorista)
    .filter((s) => !dataInicio || (s.dataDesejada && s.dataDesejada >= dataInicio))
    .filter((s) => !dataFim || (s.dataDesejada && s.dataDesejada <= dataFim))
    .filter((s) => {
      if (!search.trim()) return true;
      const q = search.trim().toLowerCase();
      return [s.numero, s.fornecedorDestino, s.notaFiscal, s.pedidosCompra, s.cidade].some((v) => (v || "").toLowerCase().includes(q));
    });

  return (
    <div className="flex-1 min-h-screen bg-mist">
      <Topbar title="Minhas STs" subtitle={`Solicitações criadas por ${profile.nome || profile.setorNome}`} />
      <div className="p-6 flex flex-col gap-4">
        <div className="flex justify-end">
          <Button variant="brand" size="sm" icon="plus" onClick={() => navigate("/nova-st")}>Nova ST</Button>
        </div>

        <Card className="p-4">
          <div className="grid md:grid-cols-4 gap-3">
            <Input icon="search" placeholder="Nº, fornecedor, pedido, NF..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <Select value={filterMotorista} onChange={(e) => setFilterMotorista(e.target.value)}>
              <option value="">Todos os motoristas</option>
              {drivers.map((d) => <option key={d.id} value={d.id}>{d.nome}</option>)}
            </Select>
            <Input type="date" placeholder="Data de" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} />
            <Input type="date" placeholder="Data até" value={dataFim} onChange={(e) => setDataFim(e.target.value)} />
          </div>
          {hasActiveFilters && (
            <button onClick={() => { setSearch(""); setFilterMotorista(""); setDataInicio(""); setDataFim(""); }} className="text-[11px] text-brand hover:underline mt-2">
              Limpar filtros
            </button>
          )}
        </Card>

        <Tabs
          active={filterStatus}
          onChange={setFilterStatus}
          tabs={[
            { value: "todas", label: "Todas" },
            { value: "solicitacao", label: "Solicitação" },
            { value: "programada", label: "Programada" },
            { value: "em_rota", label: "Em Rota" },
            { value: "finalizada", label: "Finalizada" },
          ]}
        />

        {loading ? (
          <div className="grid md:grid-cols-2 gap-4">
            <Skeleton className="h-40" />
            <Skeleton className="h-40" />
          </div>
        ) : filtered.length === 0 ? (
          <Card className="p-10">
            <EmptyState
              icon="inbox"
              title={sts.length === 0 ? "Nenhuma ST criada ainda" : "Nenhuma ST encontrada"}
              subtitle={sts.length === 0 ? "Clique em “Nova ST” para solicitar uma coleta ou entrega." : "Tente ajustar ou limpar os filtros."}
            />
          </Card>
        ) : (
          <div className="grid md:grid-cols-2 gap-4">
            {filtered.map((st) => (
              <STCard key={st.id} st={st}>
                <div className="flex flex-wrap gap-2">
                  <Button variant="outline" size="sm" icon="map" onClick={() => openRouteInMaps(st)}>Abrir rota</Button>
                  <Button variant="subtle" size="sm" icon="pencil" onClick={() => setEditing(st)}>Editar</Button>
                  <Button variant="ghost" size="sm" icon="history" onClick={() => setHistoryItem(st)}>Histórico</Button>
                </div>
              </STCard>
            ))}
          </div>
        )}
      </div>

      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing ? `Editar ${editing.numero}` : ""} maxWidth="max-w-2xl">
        {editing && <NewSTForm profile={profile} drivers={drivers} initial={editing} onDone={() => setEditing(null)} onCancel={() => setEditing(null)} />}
      </Modal>
      <TimelineModal st={historyItem} onClose={() => setHistoryItem(null)} />
    </div>
  );
}

const MOTIVO_REAGENDAMENTO_OPTIONS = [
  "Material não liberado/pronto",
  "Coleta parcial",
  "Sem disponibilidade de horário",
  "Coletado anteriormente",
];

function ReagendarModal({ st, onClose, onConfirm, saving }) {
  const [motivo, setMotivo] = useState("");
  useEffect(() => { setMotivo(""); }, [st]);
  return (
    <Modal
      open={!!st}
      onClose={onClose}
      title={st ? `Reagendar ${st.numero}` : ""}
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button variant="brand" disabled={saving} onClick={() => onConfirm(motivo)}>
            {saving ? "Enviando..." : "Confirmar reagendamento"}
          </Button>
        </>
      }
    >
      <p className="text-sm text-muted mb-3">
        Isso avisa a Logística que essa ST não foi atendida no local e precisa de uma nova data.
      </p>
      <div className="flex flex-col gap-2 mb-3">
        <span className="block text-xs font-medium text-muted">Motivo</span>
        <div className="flex flex-wrap gap-2">
          {MOTIVO_REAGENDAMENTO_OPTIONS.map((opcao) => (
            <button
              key={opcao}

/* ---------------------------------------------------------------
   LOCALIZAÇÃO DO MOTORISTA (tempo real, versão simples)
   Enquanto o motorista tiver uma ST "Em Rota" e o app aberto, o
   navegador compartilha a posição periodicamente. Guardamos só a
   última posição conhecida em drivers/{id} — sem mapa incorporado,
   só "há X min" + abrir no Google Maps.
--------------------------------------------------------------- */
function useDriverLocationSharing(driverId, isActive) {
  const [sharing, setSharing] = useState(false);
  useEffect(() => {
    if (!isActive || !driverId || !("geolocation" in navigator)) {
      setSharing(false);
      return;
    }
    let lastWrite = 0;
    setSharing(true);
    const watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const now = Date.now();
        if (now - lastWrite < 20000) return; // no máximo 1 gravação a cada 20s
        lastWrite = now;
        const { db, doc, updateDoc } = window.ST.firebase;
        updateDoc(doc(db, "drivers", driverId), {
          lastLocation: { lat: pos.coords.latitude, lng: pos.coords.longitude },
          lastLocationAtMs: now,
        }).catch((err) => console.error("Erro ao salvar localização:", err));
      },
      (err) => console.error("Erro de geolocalização:", err),
      { enableHighAccuracy: false, maximumAge: 15000, timeout: 20000 }
    );
    return () => {
      navigator.geolocation.clearWatch(watchId);
      setSharing(false);
    };
  }, [driverId, isActive]);
  return sharing;
}

function timeAgo(ms) {
  if (!ms) return "";
  const diffMin = Math.round((Date.now() - ms) / 60000);
  if (diffMin < 1) return "agora mesmo";
  if (diffMin < 60) return `há ${diffMin} min`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `há ${diffH}h`;
  return `há ${Math.round(diffH / 24)}d`;
}

function openLatLngInMaps(lat, lng) {
  window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, "_blank");
}

function DriverLocationBadge({ driver }) {
  if (!driver.lastLocation) {
    return <span className="text-[11px] text-muted">Sem localização recente</span>;
  }
  return (
    <button
      onClick={() => openLatLngInMaps(driver.lastLocation.lat, driver.lastLocation.lng)}
      className="text-[11px] text-ink hover:text-brand flex items-center gap-1 transition-colors"
    >
      <Icon name="map-pin" size={12} />
      Última localização {timeAgo(driver.lastLocationAtMs)}
    </button>
  );
}

function todayISODate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

          </div>
          {hasActiveFilters && (
            <button
              onClick={() => { setSearch(""); setFilterSetor(""); setFilterMotorista(""); setFilterVeiculo(""); setDataInicio(""); setDataFim(""); }}
              className="text-[11px] text-brand mt-2 hover:underline"
            >
              Limpar filtros
            </button>
          )}
        </Card>

        <Tabs
          active={filter}
          onChange={setFilter}
          tabs={[
            { value: "todas", label: "Todas" },
            { value: "solicitacao", label: "Solicitação" },
            { value: "programada", label: "Programada" },
            { value: "em_rota", label: "Em Rota" },
            { value: "finalizada", label: "Finalizada" },
            { value: "reagendar", label: "Precisa Reagendar" },
          ]}
        />
        {loading ? (
          <div className="grid md:grid-cols-2 gap-4"><Skeleton className="h-40" /><Skeleton className="h-40" /></div>
        ) : filtered.length === 0 ? (
          <Card className="p-10"><EmptyState icon="inbox" title="Nenhuma ST encontrada" subtitle={hasActiveFilters ? "Tente ajustar ou limpar os filtros." : undefined} /></Card>
        ) : (
          <div className="grid md:grid-cols-2 gap-4">
            {filtered.map((st) => (
              <STCard key={st.id} st={st} highlightNew>
                <p className="text-xs text-muted truncate">{st.setorNome} · {st.solicitanteNome}</p>
                <div className="flex flex-wrap gap-2 mt-1">
                  <Button variant="outline" size="sm" icon="map" onClick={() => openRouteInMaps(st)}>Abrir rota</Button>
                  {st.status !== "finalizada" && (
                    <Button variant="brand" size="sm" icon="check-circle-2" disabled={concluding === st.id} onClick={() => markAsConcluded(st)}>
                      {concluding === st.id ? "Concluindo..." : "Marcar como concluída"}
                    </Button>
                  )}
                  <Button variant="subtle" size="sm" icon="shuffle" onClick={() => setManaging(st)}>Gerenciar</Button>
                  {st.isGrupo ? (
                    <Button variant="subtle" size="sm" icon="list-plus" onClick={() => setEditingGroup(st)}>Editar grupo</Button>
                  ) : (
                    <Button variant="subtle" size="sm" icon="pencil" onClick={() => setEditingFull(st)}>Editar</Button>
                  )}
                  <Button variant="ghost" size="sm" icon="history" onClick={() => setHistoryItem(st)}>Histórico</Button>
                  {st.isGrupo && (
                    <Button variant="ghost" size="sm" icon="split" className="text-brand hover:bg-brand-soft" onClick={() => setToDelete(st)}>Desmembrar grupo</Button>
                  )}
                  {!st.isGrupo && (
                    <Button variant="ghost" size="sm" icon="trash-2" className="text-brand hover:bg-brand-soft" onClick={() => setToDelete(st)}>Excluir</Button>
                  )}
                </div>
              </STCard>
            ))}
          </div>
        )}
      </div>

      <Modal open={!!managing} onClose={() => setManaging(null)} title={managing ? `Gerenciar ${managing.numero}` : ""}>
        {managing && <ManageSTForm st={managing} drivers={drivers} onSave={saveAssignment} onCancel={() => setManaging(null)} />}
      </Modal>

      <Modal open={!!editingFull} onClose={() => setEditingFull(null)} title={editingFull ? `Editar ${editingFull.numero}` : ""} maxWidth="max-w-2xl">
        {editingFull && <NewSTForm profile={profile} drivers={drivers} initial={editingFull} onDone={() => setEditingFull(null)} onCancel={() => setEditingFull(null)} />}
      </Modal>
      <EditGroupModal open={!!editingGroup} group={editingGroup} onClose={() => setEditingGroup(null)} />
      <TimelineModal st={historyItem} onClose={() => setHistoryItem(null)} />
      <ConfirmDialog
        open={!!toDelete}
        loading={deleting}
        onClose={() => setToDelete(null)}
        onConfirm={handleDelete}
        title={toDelete && toDelete.isGrupo ? "Desmembrar grupo" : "Excluir ST"}
        message={
          toDelete
            ? toDelete.isGrupo
              ? `Tem certeza que deseja desmembrar o grupo ${toDelete.numero}? As STs que estão dentro dele NÃO são excluídas — elas voltam a aparecer sozinhas, como estavam antes de entrar no grupo. Só a junção do grupo deixa de existir.`
              : `Tem certeza que deseja excluir a ${toDelete.numero}? Isso remove a solicitação e seus anexos permanentemente — o histórico não poderá mais ser consultado.`
            : ""
        }
      />
    </div>
  );
}

function ManageSTForm({ st, drivers, onSave, onCancel }) {
  const [motoristaId, setMotoristaId] = useState(st.motoristaId || "");
  const [status, setStatus] = useState(st.status);
  const [dataDesejada, setDataDesejada] = useState(st.dataDesejada || "");
  const [horario, setHorario] = useState(st.horario || "");
  const [saving, setSaving] = useState(false);
  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-2 gap-3">
        <Input label="Dia" type="date" value={dataDesejada} onChange={(e) => setDataDesejada(e.target.value)} />
        <Input label="Horário" type="time" min="06:00" max="18:00" value={horario} onChange={(e) => setHorario(e.target.value)} />
      </div>
      <Select label="Motorista" value={motoristaId} onChange={(e) => setMotoristaId(e.target.value)}>
        <option value="">Não atribuído</option>
        {drivers.map((d) => <option key={d.id} value={d.id}>{d.nome}</option>)}
      </Select>
      <Select label="Status" value={status} onChange={(e) => setStatus(e.target.value)}>
        {Object.entries(STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </Select>
      <div className="flex justify-end gap-2 mt-1">
        <Button variant="ghost" onClick={onCancel}>Cancelar</Button>
        <Button variant="brand" disabled={saving} onClick={async () => { setSaving(true); await onSave(st, motoristaId, status, dataDesejada, horario); setSaving(false); }}>
          {saving ? "Salvando..." : "Salvar"}
        </Button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   APP ROOT
--------------------------------------------------------------- */
function FullScreenSpinner() {
  return (
    <div className="min-h-screen bg-ink flex flex-col items-center justify-center gap-4">
      <div className="w-12 h-12 rounded-2xl bg-brand flex items-center justify-center font-display font-bold text-white animate-pulseDot">ST</div>
      <p className="text-white/40 text-xs">Carregando...</p>
    </div>
  );
}

const SETOR_ROUTES = {
  "/dashboard": () => <SetorDashboardPage />,
  "/nova-st": () => <NovaSTPage />,
  "/minhas-sts": () => <MinhasSTsPage />,
  "/motoristas": () => <AcompanharMotoristasPage />,
  "/notificacoes": () => <NotificationsPage />,
  "/perfil": () => <ProfilePage />,
};

const LOGISTICA_ROUTES = {
  "/dashboard": () => <LogisticaDashboardPage />,
  "/todas-sts": () => <TodasSTsPage />,
  "/programacao": () => <ProgramacaoPage />,
  "/gestao-motoristas": () => <CadastrosPage />,
  "/veiculos": () => <CadastrosPage />,
  "/rotas": (query) => <RoutePlanningPage initialDate={query.get("data")} />,
  "/calendario": () => <CalendarPage />,
  "/cadastros": () => <CadastrosPage />,
  "/relatorios": () => <ReportsPage />,
  "/configuracoes": () => <SettingsPage />,
  "/notificacoes": () => <NotificationsPage />,
};

const MOTORISTA_ROUTES = {
  "/dashboard": () => <MotoristaSTsPage />,
  "/concluidas": () => <MotoristaConcluidasSTsPage />,
  "/perfil": () => <ProfilePage />,
};

const CONSULTA_ROUTES = {
  "/dashboard": () => <ConsultaSTsPage />,
  "/perfil": () => <ProfilePage />,
};

function AppShell() {
  const router = useRouter();
  const { user, profile, authLoading, logout } = useAuth();
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  useEffect(() => {
    refreshIcons();
  });

  // fecha o menu mobile automaticamente ao trocar de página
  useEffect(() => {
    setMobileNavOpen(false);
  }, [router.path]);

  // aguarda o Firebase resolver o estado de autenticação antes de decidir a rota
  if (authLoading) {
    return <FullScreenSpinner />;
  }

  const isLoginRoute = router.path === "/login" || router.path === "/";

  // não autenticado tentando acessar área interna → login
  if (!user && !isLoginRoute) {
    navigate("/login");
    return <FullScreenSpinner />;
  }

  // autenticado tentando acessar /login → manda para o dashboard
  if (user && isLoginRoute) {
    navigate("/dashboard");
    return <FullScreenSpinner />;
  }

  if (!user) {
    return <LoginPage />;
  }

  // usuário autenticado, mas sem doc de perfil (ex: usuário excluído pela Logística)
  if (!profile) {
    return (
      <div className="min-h-screen bg-ink flex items-center justify-center p-6">
        <div className="max-w-sm text-center text-white">
          <div className="w-12 h-12 rounded-2xl bg-brand flex items-center justify-center font-display font-bold mx-auto mb-4">!</div>
          <p className="font-display font-semibold mb-2">Conta sem acesso</p>
          <p className="text-sm text-white/60 mb-4">Seu usuário não tem mais um perfil válido no sistema. Fale com a Logística.</p>
          <Button variant="outline" size="sm" className="bg-transparent text-white border-white/20 hover:border-white" onClick={() => logout()}>
            Sair
          </Button>
        </div>
      </div>
    );
  }

  const isLogistica = profile.role === "logistica";
  const isMotorista = profile.role === "motorista";
  const isConsulta = profile.role === "consulta";
  const isUsuario = !isLogistica && !isMotorista && !isConsulta;
  const menu = isLogistica ? LOGISTICA_MENU : isMotorista ? MOTORISTA_MENU : isConsulta ? CONSULTA_MENU : SETOR_MENU;
  const routes = isLogistica ? LOGISTICA_ROUTES : isMotorista ? MOTORISTA_ROUTES : isConsulta ? CONSULTA_ROUTES : SETOR_ROUTES;
  const [basePath, queryStr] = router.path.split("?");
  const routeQuery = new URLSearchParams(queryStr || "");
  const page = (routes[basePath] || routes["/dashboard"])(routeQuery);

  return (
    <MobileNavContext.Provider value={{ open: mobileNavOpen, setOpen: setMobileNavOpen }}>
      <div className="flex">
        <Sidebar
          items={menu}
          sectorName={isUsuario ? (profile.nome || profile.setorNome) : (profile.setorNome || profile.nome)}
          subLabel={isUsuario ? profile.setorNome : isConsulta ? "Consulta" : "Sair"}
        />
        <div className="flex-1 min-w-0">{page}</div>
      </div>
    </MobileNavContext.Provider>
  );
}

function App() {
  return (
    <RouterProvider>
      <AuthProvider>
        <ToastProvider>
          <AppShell />
        </ToastProvider>
      </AuthProvider>
    </RouterProvider>
  );
}

/* Mount */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

// remove boot screen assim que o React montar
requestAnimationFrame(() => {
  const boot = document.getElementById("boot-screen");
  if (boot) {
    boot.style.transition = "opacity .3s ease";
    boot.style.opacity = "0";
    setTimeout(() => boot.remove(), 300);
  }
  refreshIcons();
});

// registra o service worker (PWA) — só funciona servido via http(s), nunca via file://
if ("serviceWorker" in navigator && window.location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>

<!-- ============================================================
     BOOTSTRAP DO APP — transforma e executa o script acima
     manualmente (em vez de deixar o Babel escanear a página
     sozinho), evitando qualquer conflito com outros scripts.
     ============================================================ -->
<script>
  (function boot() {
    try {
      const source = document.getElementById("app-source").textContent;
      const output = Babel.transform(source, { presets: ["react"] }).code;
      const script = document.createElement("script");
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      console.error("Erro ao iniciar o app:", err);
      const boot = document.getElementById("boot-screen");
      if (boot) {
        boot.innerHTML =
          '<div style="max-width:340px;text-align:center;color:#fff;font-family:Inter,sans-serif;font-size:13px;line-height:1.6;padding:0 16px">' +
          '<div style="font-weight:600;margin-bottom:8px">Erro ao carregar o app</div>' +
          String(err.message || err) +
          '<br/><br/>Abra o Console (F12) para mais detalhes.</div>';
      }
    }
  })();
</script>
</body>
